<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f6df6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CMS영상">
<link rel="apple-touch-icon" href="icon-192.png">
<title>CMS 영상 바로가기</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1c2330; --muted: #7a8494; --line: #e3e7ee;
    --accent: #2f6df6; --accent-soft: #e8efff; --done: #eef7f0; --done-line: #bfe0c8; --bad: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151b; --card: #1b2029; --ink: #e8ecf3; --muted: #8b95a6; --line: #2a303c;
      --accent: #6c97ff; --accent-soft: #1f2a44; --done: #17261c; --done-line: #2f5a3b; --bad: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; line-height: 1.4; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1100px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0 8px 0 0; }
  .tabs { display: flex; gap: 6px; }
  .tab { border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 8px 16px;
         border-radius: 999px; font-size: 15px; cursor: pointer; font-family: inherit; }
  .tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .tab small { opacity: .7; margin-left: 4px; font-weight: 400; }
  .tools { margin-left: auto; display: flex; gap: 12px; align-items: center; font-size: 13px; color: var(--muted); }
  .tools input[type=search] { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card);
                              color: var(--ink); width: 180px; font-family: inherit; }
  .chips { max-width: 1100px; margin: 0 auto; padding: 0 16px 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-size: 13px; padding: 4px 10px; border-radius: 6px; background: var(--accent-soft); color: var(--accent);
          text-decoration: none; }
  main { max-width: 1100px; margin: 0 auto; padding: 8px 16px 80px; }
  section { margin-top: 24px; scroll-margin-top: 130px; }
  h2 { font-size: 16px; margin: 0 0 10px; display: flex; align-items: baseline; gap: 8px; }
  h2 span { font-size: 12px; color: var(--muted); font-weight: 400; }
  .sub { font-size: 12px; color: var(--muted); margin: 14px 0 6px; }
  .steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .colhead { font-size: 12.5px; font-weight: 600; color: var(--accent); background: var(--accent-soft);
             border-radius: 8px; padding: 5px 10px; text-align: center; }
  .steps .btn { min-width: 0; overflow-wrap: anywhere; }
  .steps .span2 { grid-column: span 2; }
  @media (max-width: 760px) {
    .steps { grid-template-columns: 1fr; }
    .colhead, .steps .gap { display: none; }
    .steps .span2 { grid-column: auto; }
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 8px; }
  .btn { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
         font-size: 14px; color: var(--ink); cursor: pointer; font-family: inherit; line-height: 1.4; }
  .btn:hover { border-color: var(--accent); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn .pre { color: var(--muted); font-size: 12px; margin-right: 4px; }
  .btn.done { background: var(--done); border-color: var(--done-line); }
  .btn.nomatch { opacity: .55; cursor: not-allowed; border-style: dashed; }
  .btn.nomatch:hover { border-color: var(--line); }
  .btn .flag { display: block; font-size: 11.5px; color: var(--bad); margin-top: 2px; }
  a.btn { display: block; text-decoration: none; }
  .btn .date { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .btn .lock { font-size: 11.5px; color: var(--muted); margin-left: 6px; }
  h3.unit { font-size: 13.5px; margin: 18px 0 8px; color: var(--ink); display: flex; gap: 8px; align-items: baseline; }
  h3.unit span { font-size: 12px; color: var(--muted); font-weight: 400; }
  .divider { margin: 44px 0 4px; padding-top: 14px; border-top: 2px solid var(--line); font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .08em; }
  .sublabel { font-size: 11px; color: var(--muted); margin: 10px 0 5px 2px; letter-spacing: .02em; }
  .sublabel::before { content: "▸ "; opacity: .6; }
  section.private { margin-top: 40px; padding: 14px 16px 18px; border: 1px dashed var(--line); border-radius: 12px; background: color-mix(in srgb, var(--card) 55%, transparent); }
  section.private h2 { color: var(--muted); }
  .chip.private { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  .foot { color: var(--muted); font-size: 12px; margin-top: 40px; }
  .foot a { color: var(--accent); cursor: pointer; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>CMS 영상</h1>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="tools">
      <input type="search" id="q" placeholder="필터 (선택)">
      <label><input type="checkbox" id="newtab" checked> 새 탭으로 열기</label>
    </div>
  </div>
  <div class="chips" id="chips"></div>
</header>
<main id="main"></main>

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let tab = store.get("tab", "");
if (!DATA.tabs[tab]) tab = Object.keys(DATA.tabs)[0];
let done = new Set(store.get("done", []));
const $ = (s) => document.querySelector(s);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

// 클릭 -> 사이트의 비밀번호 폼과 똑같은 POST를 직접 전송 (비번 입력창을 건너뜀)
function open(item) {
  const f = document.createElement("form");
  f.method = "post"; f.action = DATA.base + "/genius/view/" + item.i;
  f.target = $("#newtab").checked ? "_blank" : "_self";
  for (const [k, v] of [["bidx", item.i], ["onetime", "false"], ["passwd", item.pw]]) {
    const i = document.createElement("input"); i.type = "hidden"; i.name = k; i.value = v; f.appendChild(i);
  }
  document.body.appendChild(f); f.submit(); f.remove();
  done.add(item.t); store.set("done", [...done]);
}

function render() {
  const q = $("#q").value.trim().replace(/\s+/g, "").toLowerCase();
  // 탭
  const tabs = $("#tabs"); tabs.textContent = "";
  for (const name of Object.keys(DATA.tabs)) {
    const n = DATA.tabs[name].reduce((a, g) => a + (g.n || g.items.length), 0);
    const b = el("button", "tab"); b.setAttribute("role", "tab"); b.setAttribute("aria-selected", name === tab);
    b.append(name, Object.assign(el("small", null, n)));
    b.onclick = () => { tab = name; store.set("tab", tab); render(); window.scrollTo(0, 0); };
    tabs.appendChild(b);
  }
  // 본문
  const main = $("#main"), chips = $("#chips"); main.textContent = ""; chips.textContent = "";
  let shown = 0;
  const mk = (it) => {
    if (it.u) {                         // 유튜브 영상: 그냥 링크
      const a = el("a", "btn" + (done.has(it.u) ? " done" : "")); a.href = it.u; a.rel = "noopener";
      a.target = $("#newtab").checked ? "_blank" : "_self";
      a.append(it.t); if (it.p) a.appendChild(el("span", "lock", "🔒 비공개"));
      if (it.d) a.appendChild(el("span", "date", it.d));
      a.onclick = () => { done.add(it.u); store.set("done", [...done]); a.classList.add("done"); };
      return a;
    }
    const b = el("button", "btn" + (it.i ? "" : " nomatch") + (done.has(it.t) ? " done" : ""));
    b.type = "button";
    const m = it.t.match(/^(\[[^\]]*\])\s*(.*)$/);
    if (m) { b.appendChild(el("span", "pre", m[1])); b.append(m[2]); } else b.append(it.t);
    if (!it.i) { b.disabled = true; b.appendChild(el("span", "flag", it.bad ? "비번이 사이트와 안 맞음" : "사이트에서 같은 제목을 못 찾음")); }
    else b.onclick = () => { open(it); b.classList.add("done"); };
    return b;
  };
  const hit = (it) => !q || (it.t + it.pw).replace(/\s+/g, "").toLowerCase().includes(q);
  DATA.tabs[tab].forEach((g, gi) => {
    const sec = el("section"); sec.id = "g" + gi;
    let count = 0;
    if (g.section) sec.dataset.divider = g.section;
    if (g.units) {                      // 과정 > 단원(순서대로) > 소분류(기본/심화/기타) > 영상
      if (g.private) sec.classList.add("private");
      for (const u of g.units) {
        const blocks = u.subs ? u.subs.map(sb => ({ name: sb.name, items: sb.items.filter(hit) }))
                              : [{ name: "", items: u.items.filter(hit) }];
        const total = blocks.reduce((a, b) => a + b.items.length, 0);
        if (!total) continue;
        count += total;
        const h3 = el("h3", "unit", u.name); h3.appendChild(el("span", null, total + "개")); sec.appendChild(h3);
        for (const b of blocks) {
          if (!b.items.length) continue;
          if (b.name) sec.appendChild(el("div", "sublabel", b.name));
          const grid = el("div", "grid"); sec.appendChild(grid);
          for (const it of b.items) grid.appendChild(mk(it));
        }
      }
      if (!count) return;
    } else if (g.rows) {                // 단원 = 한 줄, 같은 STEP끼리 세로 정렬
      const grid = el("div", "steps");
      for (const c of g.cols) grid.appendChild(el("div", "colhead", c));
      for (const row of g.rows) {
        const vis = row.filter(c => c && hit(c));
        if (!vis.length) continue;
        count += vis.length;
        row.forEach((c, ci) => {
          if (ci > 0 && row[ci - 1] && row[ci - 1].span) return;   // 합본(A·B 또는 B·C)이 칸 2개를 차지함
          if (!c) { grid.appendChild(el("div", "gap")); return; }
          if (!hit(c)) { grid.appendChild(el("div", "gap" + (c.span ? " span2" : ""))); return; }
          const b = mk(c); if (c.span) b.classList.add("span2"); grid.appendChild(b);
        });
      }
      if (!count) return;
      sec.appendChild(grid);
    } else {                            // 중대기 / 경시입문: 단순 목록
      const items = g.items.filter(hit);
      if (!items.length) return;
      count = items.length;
      const grid = el("div", "grid"); sec.appendChild(grid);
      for (const it of items) grid.appendChild(mk(it));
    }
    const h = el("h2", null, g.name); h.appendChild(el("span", null, count + "개")); sec.prepend(h);
    const a = el("a", "chip" + (g.private ? " private" : ""), g.name); a.href = "#g" + gi; chips.appendChild(a);
    shown += count;
    if (g.section && !q) main.appendChild(el("div", "divider", g.section));
    main.appendChild(sec);
  });
  if (!shown) main.appendChild(el("div", "empty", "결과 없음"));
  const foot = el("div", "foot", "초록색 = 이미 눌러본 항목 · ");
  const reset = el("a", null, "표시 초기화"); reset.onclick = () => { done = new Set(); store.set("done", []); render(); };
  foot.appendChild(reset); main.appendChild(foot);
}
$("#q").addEventListener("input", render);
$("#newtab").checked = store.get("newtab", true);
$("#newtab").addEventListener("change", e => store.set("newtab", e.target.checked));
render();
</script>
