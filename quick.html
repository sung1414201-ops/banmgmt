<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="빠른정답"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>빠른정답 모음</title><link rel="manifest" href="quick.webmanifest"><link rel="apple-touch-icon" href="quick-icon-192.png"><meta name="theme-color" content="#8e1a7a">
<style>
:root{--bg:#f6f4f0;--card:#fff;--ink:#1d1b1a;--sub:#6b655f;--line:#e2ddd5;--pt:#8e1a7a;--chip:#efe9f3}
@media (prefers-color-scheme:dark){:root{--bg:#171515;--card:#221f1f;--ink:#efe9e4;--sub:#a79f98;--line:#3a3535;--chip:#2e2433}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;font-size:15px}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0;color:var(--pt);cursor:pointer}
header .crumb{color:var(--sub);font-size:14px}
header input{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 10px;border-radius:8px;font-size:14px;min-width:200px}
main{padding:14px 16px 60px;max-width:1900px;margin:0 auto}
.ser{margin:18px 0 6px;font-size:16px;font-weight:700;border-left:5px solid var(--pt);padding-left:9px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:block}
.card:hover{border-color:var(--pt)}
.card b{display:block;font-size:15px}.card small{color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.chip{background:var(--chip);border-radius:16px;padding:5px 12px;font-size:14px;cursor:pointer;border:1px solid transparent}
.chip.on{border-color:var(--pt);font-weight:700}
.unit{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 16px;padding:10px 14px 14px}
.unit>h2{font-size:17px;margin:2px 0 10px;color:var(--pt)}
.srclk{font-size:12px;font-weight:400;color:var(--sub);margin-left:12px}
.srclk a{color:var(--sub);text-decoration:underline;margin:0 2px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px 22px;align-items:start}
.step img.band{height:40px;max-width:100%;display:block;margin:0 0 6px}
.nolab{height:6px}
.row{display:flex;gap:8px;padding:2px 0;border-bottom:1px dotted var(--line);line-height:1.45;min-height:23px}
.row .no{flex:0 0 34px;text-align:right;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums}
.row .ans{flex:1;font-family:"Cambria Math","STIX Two Text","Times New Roman","Batang",serif;font-size:16px;overflow-wrap:anywhere}
.row img.fig{display:block;max-height:150px;max-width:100%;margin-top:3px;background:#fff;border:1px solid var(--line);border-radius:4px}
.row img.fig{cursor:zoom-in}
.row img.fig.big{max-height:none;width:100%;max-width:560px}
.row img.fig.crop{max-height:none;max-width:100%;height:auto;border:0;background:transparent;margin-top:0}
#lb{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;overflow:auto;cursor:zoom-out}
#lb[hidden]{display:none}
#lb img{width:min(96vw,900px);height:auto;max-height:none;background:#fff;border-radius:6px;margin:auto}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.9em;line-height:1.15;margin:0 2px}
.frac>span:first-child{border-bottom:1px solid currentColor;padding:0 2px}
.ov{border-top:1px solid currentColor;padding:0 1px}
.dt{position:relative;display:inline-block}
.dt::before{content:"";position:absolute;top:.05em;left:50%;width:.14em;height:.14em;border-radius:50%;background:currentColor;transform:translateX(-50%)}
.lr,.ar{position:relative;display:inline-block;padding:0 1px;margin-top:.5em}
.lr::before,.ar::before{position:absolute;left:0;right:0;top:-.72em;height:.6em;line-height:.6em;font-size:.82em;overflow:hidden;white-space:nowrap;text-align:center;font-family:Arial,sans-serif}
.lr::before{content:"\2194"}
.ar::before{content:"\2192"}
.back{border:1px solid var(--pt);background:var(--pt);color:#fff;padding:6px 14px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.back:hover{filter:brightness(1.12)}
.back[hidden]{display:none}
.fab{position:fixed;right:18px;bottom:18px;z-index:6;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.mat{display:inline-block;vertical-align:middle;margin:0 3px;padding:0 3px;border-left:2px solid currentColor;border-right:2px solid currentColor;border-radius:7px}.mat table{border-collapse:collapse;font-size:.95em}.mat td{padding:1px 7px;text-align:center;white-space:nowrap}
.sq{white-space:nowrap}.sq>span{border-top:1px solid currentColor;padding:0 1px}
sup,sub{font-size:.7em;line-height:0}
.note{color:var(--sub);font-size:13px;margin:6px 0}
@media print{header{display:none}.unit{break-inside:avoid}}
/* ===== 빠른정답 앱 레이어(폰·태블릿·PC 공용) — 클라우드판에만 덧씌움 ===== */
:root{--hh:56px;--fs:1;--bar:58px;--r:14px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;color-scheme:light dark;-webkit-tap-highlight-color:transparent}
body{overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
/* 상단 앱바 */
header{padding:calc(8px + var(--sat)) calc(12px + var(--sar)) 8px calc(12px + var(--sal));gap:8px;flex-wrap:nowrap;
  background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px)}
header h1{font-size:18px;white-space:nowrap;letter-spacing:-.2px}
header small{display:none}
header .crumb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header>span[style*="flex:1"]{display:none}
header input#q{flex:0 1 260px;min-width:0;border-radius:20px;padding:8px 14px;font-size:15px}
header .back{border-radius:20px;min-height:36px}
#qaTools{display:flex;gap:6px;align-items:center;margin-left:auto}
#qaTools button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;min-width:38px;height:36px;padding:0 10px;font-size:15px;cursor:pointer;line-height:1}
#qaTools button:active{transform:scale(.94)}
#qaTools button.on{color:#e0a100;border-color:#e0a100}
#qaTools button[hidden]{display:none}
body:not(.qa-book) #qaTools .qa-bk{display:none}
/* 본문 */
main{padding:14px calc(14px + var(--sar)) calc(var(--bar) + var(--sab) + 40px) calc(14px + var(--sal))}
#app>*{animation:qaIn .22s ease both}
@keyframes qaIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#app>*{animation:none}html{scroll-behavior:auto}}
.ser{margin:22px 0 8px;font-size:calc(17px*var(--fs));scroll-margin-top:calc(var(--hh) + 56px)}
.cards{grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.card{position:relative;border-radius:var(--r);padding:14px 38px 14px 14px;min-height:64px;transition:transform .12s,box-shadow .12s,border-color .12s}
.card:active{transform:scale(.98)}
.card:hover{box-shadow:0 4px 14px rgba(0,0,0,.10)}
.card b{font-size:calc(15px*var(--fs));line-height:1.3}
.card small{display:block;margin-top:4px}
.card .fav{position:absolute;top:6px;right:6px;width:32px;height:32px;border:0;background:transparent;color:var(--sub);font-size:19px;cursor:pointer;border-radius:50%;opacity:.55}
.card .fav.on{color:#e0a100;opacity:1}
.card .fav:active{transform:scale(.88)}
/* 홈의 즐겨찾기·최근 */
.qaSec{margin:6px 0 4px}
.qaSec .ser{margin-top:14px}
.qaJump{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;margin:0 -2px;scrollbar-width:none;position:sticky;top:var(--hh);z-index:4;background:var(--bg)}
.qaJump::-webkit-scrollbar{display:none}
.qaJump span{flex:0 0 auto;background:var(--chip);border-radius:18px;padding:7px 14px;font-size:14px;cursor:pointer;white-space:nowrap}
.qaJump span:active{transform:scale(.95)}
/* 책 화면 */
.chips{gap:8px}
.chip{padding:9px 15px;font-size:calc(14px*var(--fs));border-radius:20px;min-height:38px;display:inline-flex;align-items:center}
.chip.on{background:var(--pt);color:#fff;border-color:var(--pt)}
.unit{border-radius:var(--r);padding:12px 16px 16px;scroll-margin-top:calc(var(--hh) + 60px)}
.unit>h2{font-size:calc(17px*var(--fs))}
.row{padding:5px 0;min-height:34px;align-items:baseline}
.row .no{flex:0 0 46px;font-size:calc(14px*var(--fs))}
.row .ans{font-size:calc(17px*var(--fs))}
.steps{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
/* 상태 표시 */
#qSt{bottom:calc(10px + var(--sab));left:calc(10px + var(--sal))}
/* 폰: 하단 탭 바 */
#qaBar{display:none}
@media (max-width:700px){
  header{flex-wrap:wrap;row-gap:6px}
  header input#q{flex:1 1 100%;order:20;font-size:16px}
  body.qa-book header input#q{display:none}
  #qaTrash{display:none}
  body.qa-book header{flex-wrap:nowrap}
  body.qa-book header h1{display:none}
  body.qa-book #qaTools{flex:0 0 auto}
  main{padding-left:calc(10px + var(--sal));padding-right:calc(10px + var(--sar))}
  .cards{grid-template-columns:repeat(2,1fr);gap:8px}
  .fab{display:none!important}
  .chips{flex-wrap:nowrap;overflow-x:auto;margin:0 -10px 12px;padding:6px 10px;position:sticky;top:var(--hh);z-index:4;background:var(--bg);scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto}
  .steps{grid-template-columns:1fr}
  #qaBar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--bar) + var(--sab));padding:0 var(--sar) var(--sab) var(--sal);
    background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
  #qaBar button{flex:1;border:0;background:transparent;color:var(--sub);font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
  #qaBar button b{font-size:21px;line-height:1;font-weight:400}
  #qaBar button.on{color:var(--pt);font-weight:700}
  #qaBar button:active{transform:scale(.94)}
  #qSt{bottom:calc(var(--bar) + var(--sab) + 8px)}
}
/* 태블릿 이상: 책 화면은 왼쪽 단원 목록 + 오른쪽 내용 */
@media (min-width:1000px){
  body.qa-book #app{display:grid;grid-template-columns:240px minmax(0,1fr);gap:0 18px;align-items:start}
  body.qa-book .chips{grid-column:1;grid-row:1 / span 200;position:sticky;top:calc(var(--hh) + 10px);flex-direction:column;flex-wrap:nowrap;align-self:start;max-height:calc(100vh - var(--hh) - 24px);overflow:auto;margin:0;padding:4px 2px}
  body.qa-book .chip{border-radius:12px;justify-content:flex-start;width:100%}
  body.qa-book .unit{grid-column:2}
  body.qa-book .steps{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
}
/* 카드 ⋯ 버튼, 메뉴 시트, 이름 변경 창, 휴지통 */
.card .more{position:absolute;bottom:6px;right:6px;width:34px;height:28px;border:0;background:transparent;color:var(--sub);font-size:20px;line-height:1;cursor:pointer;border-radius:8px;letter-spacing:1px}
.card .more:hover{background:var(--chip)}
#qaSheet{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center}
#qaSheet .qaShade{position:absolute;inset:0;background:rgba(0,0,0,.45);animation:qaIn .15s ease both}
#qaSheet .qaPanel{position:relative;width:min(440px,100%);background:var(--card);border-radius:20px 20px 0 0;padding:16px 16px calc(14px + var(--sab));box-shadow:0 -8px 30px rgba(0,0,0,.25);animation:qaUp .2s ease both}
@keyframes qaUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#qaSheet h3{margin:0 0 10px;font-size:16px;line-height:1.35}
#qaSheet .qaPanel>button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);font-size:16px;padding:14px 8px;border-top:1px solid var(--line);cursor:pointer;border-radius:8px}
#qaSheet .qaPanel>button:active{background:var(--chip)}
#qaSheet .danger,.danger{color:#d12f2f!important}
.qaHint{margin:0 0 10px;color:var(--sub);font-size:13px}
#qaRn{width:100%;font-size:17px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-family:inherit}
.qaRow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.qaRow button{flex:1;min-width:84px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px 10px;font-size:15px;cursor:pointer}
.qaRow button.pri,.trashItem button.pri{background:var(--pt);color:#fff;border-color:var(--pt)}
@media (min-width:700px){#qaSheet{align-items:center}#qaSheet .qaPanel{border-radius:20px}}
#qaTn{display:none;font-style:normal;font-size:10px;background:#d12f2f;color:#fff;border-radius:9px;min-width:16px;height:16px;line-height:16px;text-align:center;margin-left:3px;vertical-align:top}
body.qa-trash #app{display:block!important}
.trashHead{display:flex;flex-direction:column;gap:3px;margin:6px 0 14px}.trashHead b{font-size:19px}.trashHead span{color:var(--sub);font-size:13px}
.trashList{display:flex;flex-direction:column;gap:10px}
.trashItem{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;flex-wrap:wrap}
.trashItem .ti{flex:1 1 220px;min-width:0}.trashItem b{font-size:15px}.trashItem small{display:block;color:var(--sub);margin-top:3px;line-height:1.5}
.trashItem em{font-style:normal;color:#d97706}
.trashItem button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:8px 14px;font-size:14px;cursor:pointer}
.trashItem button.danger{border-color:#e6b5b5}
button.wide{display:block;width:100%;margin-top:16px;border:1px solid #e6b5b5;background:var(--card);border-radius:14px;padding:13px;font-size:15px;cursor:pointer}
body.qa-trash .qa-bk{display:none!important}
/* 설치 안내(아이폰) */
#qaIos{position:fixed;left:12px;right:12px;bottom:calc(var(--bar) + var(--sab) + 12px);z-index:40;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:14px;line-height:1.5}
#qaIos button{margin-top:8px;border:0;background:var(--pt);color:#fff;border-radius:16px;padding:6px 14px}
@media print{#qaBar,#qaTools,#qaJump,.qaJump,#qSt,#qaIos{display:none!important}}
</style></head><body>
<header><button class="back" id="back" hidden>← 교재 목록</button><h1 id="home">빠른정답 모음</h1><small style="font-size:11px;opacity:.6;margin-left:6px;white-space:nowrap">클라우드판</small><span class="crumb" id="crumb"></span><span style="flex:1"></span><input id="q" placeholder="교재 검색 (예: 중2-1, 대수, 코어)"></header>
<main id="app"></main>
<button class="back fab" id="fab" hidden>← 교재 목록</button>
<script>
const BOOKS=[];const PEND=[];const IMGMEM={};const IM=p=>IMGMEM[p]||"";
const app=document.getElementById('app'),crumb=document.getElementById('crumb'),q=document.getElementById('q');
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function grp(s,i){let d=0,j=i;for(;j<s.length;j++){if(s[j]=='{')d++;else if(s[j]=='}'){d--;if(!d)break;}}return [s.slice(i+1,j),j+1];}
function rm(s){
  let o='',i=0;
  while(i<s.length){
    if(s.startsWith('\\frac',i)){let [a,j]=grp(s,i+5);let [b,k]=grp(s,j);o+='<span class="frac"><span>'+rm(a)+'</span><span>'+rm(b)+'</span></span>';i=k;}
    else if(s.startsWith('\\ov',i)){let [a,j]=grp(s,i+3);o+='<span class="ov">'+rm(a)+'</span>';i=j;}
    else if(s.startsWith('\\mat',i)){let [a,j]=grp(s,i+4);o+='<span class="mat"><table>'+a.split(';').map(r=>'<tr>'+r.split(',').map(c=>'<td>'+rm(c.trim())+'</td>').join('')+'</tr>').join('')+'</table></span>';i=j;}
    else if(s.startsWith('\\lr',i)){let [a,j]=grp(s,i+3);o+='<span class="lr">'+rm(a)+'</span>';i=j;}
    else if(s.startsWith('\\ar',i)){let [a,j]=grp(s,i+3);o+='<span class="ar">'+rm(a)+'</span>';i=j;}
    else if(s.startsWith('\\sqrt',i)){let [a,j]=grp(s,i+5);o+='<span class="sq">√<span>'+rm(a)+'</span></span>';i=j;}
    else if(s[i]=='^'&&s[i+1]=='{'){let [a,j]=grp(s,i+1);o+='<sup>'+rm(a)+'</sup>';i=j;}
    else if(s[i]=='_'&&s[i+1]=='{'){let [a,j]=grp(s,i+1);o+='<sub>'+rm(a)+'</sub>';i=j;}
    else if(s[i]=='\n'){o+='<br>';i++;}
    else if(s[i+1]==='̇'){o+='<span class="dt">'+esc(s[i])+'</span>';i+=2;}
    else {o+=esc(s[i]);i++;}
  }return o;}
const label=b=>b.series+' '+b.key;
function home(f){
  crumb.textContent='';let h='';const by={};
  BOOKS.filter(b=>!f||(label(b)).toLowerCase().includes(f.toLowerCase())).forEach(b=>{const sk=(b.series==='어드밴스 중등'&&b.key.includes('더블유'))?'어드밴스 중등 · 더블유':b.series;(by[sk]=by[sk]||[]).push(b);});
  const order=['코어 고등 본책','코어 고등 LEVEL UP','챌린지 고등 본책','챌린지 고등 LEVEL UP','케이블 코어','케이블 챌린지','챌린지 중등','어드밴스 중등','어드밴스 중등 · 더블유','에이급','블랙라벨','실력정석','내신 Perfect','원리해설','경시교재','CMS 제작교재'];
  const ks=Object.keys(by).sort((a,b)=>(order.indexOf(a)<0?99:order.indexOf(a))-(order.indexOf(b)<0?99:order.indexOf(b)));
  for(const k of ks){h+='<div class="ser">'+esc(k)+'</div><div class="cards">';
    by[k].sort((a,b)=>JSON.stringify(a.sort)<JSON.stringify(b.sort)?-1:1).forEach(b=>{h+='<a class="card" href="#'+b.id+'"><b>'+esc(b.key)+'</b><small>'+b.units.length+'개 단원 · '+b.n+'문항</small></a>';});h+='</div>';}
  if(!f&&PEND.length) h+='<div class="ser">아직 글자로 못 바꾼 책 (그림판에서 보기)</div><p class="note">'+PEND.map(esc).join(' · ')+' — <a href="빠른정답_이미지판.html" style="text-decoration:underline">이미지판 열기</a></p>';
  app.innerHTML=h||'<p class="note">검색 결과가 없습니다.</p>';}
function unitHtml(u,ui){
  const bk=BOOKS.find(x=>x.units.includes(u));
  let src='';
  const pf='';
  if(pf){const base=encodeURI('file:///'+pf.replace(/\\/g,'/'));
    src='<span class="srclk">원본 PDF '+((u.p&&u.p.length)?u.p.map(p=>'<a href="'+base+'#page='+p+'" target="_blank">'+p+'쪽</a>').join(' · '):'<a href="'+base+'" target="_blank">열기</a>')+'</span>';}
  let h='<section class="unit" id="u'+ui+'"><h2>'+esc(u.t.join(' › '))+src+'</h2><div class="steps">';

    if(k==='home'){if(curId())goHome();else scrollTo({top:0})}
    else if(k==='search'){if(curId())goHome();setTimeout(()=>{$('q').focus()},60)}
    else if(k==='fav'){if(curId())goHome();setTimeout(()=>{const s=document.querySelector('.qaSec.fav');if(s)s.scrollIntoView({block:'start'});else toast('★로 즐겨찾기를 추가해 보세요')},80)}
    else if(k==='trash'){location.hash=inTrash()?'':'trash'}
    else if(k==='sync'){const s=$('qSt');if(s)s.click()}};
  function barState(){bar.querySelector('[data-a=home]').classList.toggle('on',!curId());bar.querySelector('[data-a=trash]').classList.toggle('on',inTrash())}

  /* ===== 책 메뉴(이름 변경·즐겨찾기·휴지통) ===== */
  function closeSheet(){const s=$('qaSheet');if(s)s.remove()}
  function openMenu(id){
    const b=bookOf(id);if(!b)return;closeSheet();
    const el=document.createElement('div');el.id='qaSheet';
    el.innerHTML='<div class="qaShade"></div><div class="qaPanel"><h3>'+esc(label(b))+'</h3>'
      +'<button data-a="rename">✏️ 이름 변경</button>'
      +'<button data-a="fav">'+(favs.includes(id)?'★ 즐겨찾기 해제':'☆ 즐겨찾기 추가')+'</button>'
      +'<button data-a="trash" class="danger">🗑 휴지통으로 이동</button><button data-a="close">닫기</button></div>';
    el.onclick=e=>{
      if(e.target.classList.contains('qaShade')){closeSheet();return}
      const a=e.target.closest('button');if(!a)return;const k=a.dataset.a;
      if(k==='close')closeSheet();
      else if(k==='fav'){toggleFav(id);closeSheet();syncStar();if(!curId())decorateHomeRefresh()}
      else if(k==='rename'){closeSheet();renameDialog(id)}
      else if(k==='trash'){closeSheet();doTrash(id)}};
    document.body.appendChild(el);
  }
  async function doTrash(id){
    const b=bookOf(id);if(!b)return;
    const wasBook=!!curId();
    const ok=await QA.trash(id);
    favs=favs.filter(x=>x!==id);set('qa_fav',favs);
    toast(ok?'휴지통으로 옮겼어요 · 30일 뒤 자동 삭제':'휴지통으로 옮겼어요(연결이 되면 다른 기기에도 반영돼요)');
    if(wasBook&&!inTrash())goHome();
  }
  function renameDialog(id){
    const b=bookOf(id);if(!b)return;
    const renamed=!!(QA.user().rn||{})[id];
    const d=document.createElement('div');d.id='qaSheet';
    d.innerHTML='<div class="qaShade"></div><div class="qaPanel"><h3>이름 변경</h3><p class="qaHint">'+esc(b.series)+' · 책 이름만 바꿔요. 폰·PC에 똑같이 적용돼요.</p><input id="qaRn" type="text" maxlength="60" value="'+esc(b.key).replace(/"/g,'&quot;')+'"><div class="qaRow"><button data-a="save" class="pri">저장</button>'+(renamed?'<button data-a="reset">원래 이름으로</button>':'')+'<button data-a="close">취소</button></div></div>';
    d.onclick=async e=>{
      if(e.target.classList.contains('qaShade')){d.remove();return}
      const a=e.target.closest('button');if(!a)return;const k=a.dataset.a;
      if(k==='close')d.remove();
      else if(k==='save'){const v=$('qaRn').value.trim();if(!v){toast('이름을 입력해 주세요');return}d.remove();const ok=await QA.rename(id,v);toast(ok?'이름을 바꿨어요':'이름을 바꿨어요(연결이 되면 다른 기기에도 반영돼요)')}
      else if(k==='reset'){d.remove();await QA.rename(id,'');toast('원래 이름으로 되돌렸어요')}};
    d.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();d.querySelector('[data-a=save]').click()}else if(e.key==='Escape')d.remove()});
    document.body.appendChild(d);setTimeout(()=>{const i=$('qaRn');i.focus();i.select()},50);
  }

  /* ===== 휴지통 화면 ===== */
  function renderTrash(){
    const app=$('app');crumb.textContent='› 휴지통';
    const tr=QA.user().tr||{};
    const ids=Object.keys(tr).filter(id=>QA.all().some(b=>b.id==id)).sort((a,b)=>tr[b]-tr[a]);
    let h='<div class="trashHead"><b>🗑 휴지통</b><span>넣은 지 30일이 지나면 자동으로 영구 삭제돼요.</span></div>';
    if(!ids.length)h+='<p class="note" style="font-size:15px;padding:18px 4px">휴지통이 비어 있어요.</p>';
    else h+='<div class="trashList">'+ids.map(id=>{
      const b=QA.all().find(x=>x.id==id),left=Math.max(0,Math.ceil((tr[id]+QA.keepDays*DAY-Date.now())/DAY));
      return '<div class="trashItem" data-id="'+id+'"><div class="ti"><b>'+esc(label(b))+'</b><small>'+b.units.length+'개 단원 · '+b.n+'문항<br>'+fmtDate(tr[id])+' 삭제 · <em>'+left+'일 뒤 자동 삭제</em></small></div><button data-a="restore" class="pri">복원</button><button data-a="purge" class="danger">지금 삭제</button></div>'}).join('')+'</div><button id="qaEmpty" class="danger wide">휴지통 비우기</button>';
    app.innerHTML=h;
    app.querySelectorAll('.trashItem button').forEach(btn=>btn.onclick=async()=>{
      const id=btn.closest('.trashItem').dataset.id,b=QA.all().find(x=>x.id==id);
      if(btn.dataset.a==='restore'){await QA.restore(id);toast('복원했어요')}
      else if(confirm('"'+label(b)+'" 을(를) 지금 영구 삭제할까요?\n되돌릴 수 없어요.')){await QA.purge(id);toast('삭제했어요')}});
    const em=$('qaEmpty');if(em)em.onclick=async()=>{if(confirm('휴지통의 책 '+ids.length+'권을 모두 영구 삭제할까요?\n되돌릴 수 없어요.')){await QA.purge(ids);toast('휴지통을 비웠어요')}};
  }

  /* ===== 홈 꾸미기: 별·⋯ 버튼, 즐겨찾기·최근 본 책, 시리즈 바로가기 ===== */
  const miniCard=b=>'<a class="card" href="#'+b.id+'"><b>'+esc(label(b))+'</b><small>'+b.units.length+'개 단원 · '+b.n+'문항</small></a>';
  function decorateCard(a){
    if(a.querySelector('.fav'))return;const id=a.getAttribute('href').slice(1);
    const s=document.createElement('button');s.className='fav'+(favs.includes(id)?' on':'');s.textContent=favs.includes(id)?'★':'☆';s.setAttribute('aria-label','즐겨찾기');
    s.onclick=e=>{e.preventDefault();e.stopPropagation();toggleFav(id);decorateHomeRefresh()};
    const m=document.createElement('button');m.className='more';m.textContent='⋯';m.setAttribute('aria-label','이름 변경·휴지통');
    m.onclick=e=>{e.preventDefault();e.stopPropagation();openMenu(id)};
    a.appendChild(s);a.appendChild(m);
  }
  function decorateHome(){
    const app=$('app');if(!app)return;
    app.querySelectorAll('a.card').forEach(decorateCard);
    trashBadge();
    if($('q').value)return;
    const fb=favs.map(bookOf).filter(Boolean),rb=recents.map(bookOf).filter(Boolean).filter(b=>!favs.includes(b.id)).slice(0,6);
    let top='';
    if(fb.length)top+='<div class="qaSec fav"><div class="ser">★ 즐겨찾기</div><div class="cards">'+fb.map(miniCard).join('')+'</div></div>';
    if(rb.length)top+='<div class="qaSec"><div class="ser">최근 본 책</div><div class="cards">'+rb.map(miniCard).join('')+'</div></div>';
    const sers=[...app.querySelectorAll(':scope>.ser')];
    const jump=sers.length>1?'<div class="qaJump" id="qaJump">'+sers.map((s,i)=>'<span data-i="'+i+'">'+esc(s.textContent)+'</span>').join('')+'</div>':'';
    app.insertAdjacentHTML('afterbegin',jump+top);
    const j=$('qaJump');if(j)j.onclick=e=>{const t=e.target.closest('span');if(!t)return;sers[+t.dataset.i].scrollIntoView({behavior:'smooth',block:'start'})};
    app.querySelectorAll('.qaSec a.card').forEach(decorateCard);
  }
  function decorateHomeRefresh(){const y=scrollY;home($('q').value);scrollTo(0,y)}
  const _home=home;home=function(f){_home(f);decorateHome()};

  /* ===== 라우팅 보강 ===== */
  function onRoute(){
    const id=curId(),tr=id==='trash';
    document.body.classList.toggle('qa-book',!!id&&!tr);
    document.body.classList.toggle('qa-trash',tr);
    if(id&&!tr&&bookOf(id)){recents=[id,...recents.filter(x=>x!==id)].slice(0,12);set('qa_recent',recents)}
    syncStar();barState();trashBadge();hh();
    const on=document.querySelector('.chips .chip.on');
    if(on){const c=on.parentElement;if(c.scrollHeight>c.clientHeight+4)c.scrollTop=on.offsetTop-c.clientHeight/2;else if(c.scrollWidth>c.clientWidth+4)c.scrollLeft=on.offsetLeft-c.clientWidth/2}
  }
  addEventListener('hashchange',()=>{closeSheet();onRoute()});
  const _book=book;book=function(id,sel){if(id==='trash'){renderTrash()}else _book(id,sel);onRoute()};

  /* 스와이프로 단원 이동, 키보드 */
  let sx=0,sy=0,st=0,ok=false;
  const unitMove=d=>{const [id,sel]=location.hash.slice(1).split('/');if(!id||id==='trash'||sel==='all')return false;const b=bookOf(id);if(!b)return false;const n=(sel===undefined?0:+sel)+d;if(n<0||n>=b.units.length)return false;location.hash=id+'/'+n;return true};
  document.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now();ok=!e.target.closest('.chips,.qaJump,#lb,input,.mat,table,#qaSheet')&&e.touches.length===1},{passive:true});
  document.addEventListener('touchend',e=>{if(!ok||!curId())return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)>80&&Math.abs(dy)<45&&Date.now()-st<600){if(unitMove(dx<0?1:-1))toast(dx<0?'다음 단원':'이전 단원')}},{passive:true});
  document.addEventListener('keydown',e=>{
    if(/INPUT|TEXTAREA/.test((e.target||{}).tagName||''))return;
    if(e.key==='/'){e.preventDefault();if(curId())goHome();setTimeout(()=>$('q').focus(),50)}
    else if(e.key==='ArrowRight')unitMove(1);else if(e.key==='ArrowLeft')unitMove(-1)});

  /* 앱 설치 */
  let dip=null;
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;$('qaInst').hidden=false});
  $('qaInst').onclick=async()=>{if(!dip)return;dip.prompt();try{await dip.userChoice}catch(x){}dip=null;$('qaInst').hidden=true};
  addEventListener('appinstalled',()=>{$('qaInst').hidden=true});
  const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!standalone&&!get('qa_ios',0)){
    const d=document.createElement('div');d.id='qaIos';d.innerHTML='아이폰·아이패드에서는 사파리 <b>공유(□↑)</b> → <b>홈 화면에 추가</b>를 누르면 앱처럼 쓸 수 있어요.<br><button>알겠어요</button>';
    d.querySelector('button').onclick=()=>{set('qa_ios',1);d.remove()};document.body.appendChild(d)}

  /* 서비스 워커 */
  if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('quick-sw.js',{scope:'./quick.html'}).catch(()=>{})}

  onRoute();
  if(!curId())decorateHome();
})();

</script></body></html>
