<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1968b3"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png">
<title>반 관리</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1d2330;--sub:#6b7385;--line:#e3e6ec;--pri:#1968b3;--o:#e4f3ff;--ob:#0aa0ff;--x:#ffe8ea;--xb:#ff5a67;--warn:#c2410c}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1d222b;--ink:#e8ebf2;--sub:#98a1b3;--line:#2c3340;--pri:#5aa3ee;--o:#0f2c45;--x:#44212a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"Malgun Gothic",sans-serif}
header{flex-wrap:wrap;position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 16px}
header h1{font-size:17px;margin:0;cursor:pointer}
header nav{margin-left:auto;display:flex;gap:6px}
main{padding:16px;max-width:1200px;margin:0 auto}
button,select,input,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.sm{padding:3px 8px;font-size:13px}
.btn.danger{color:var(--warn)}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--card)}
textarea{width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.card.click{cursor:pointer}.card.click:hover{border-color:var(--pri)}
.badge{display:inline-block;font-size:12px;border-radius:99px;padding:1px 9px;background:var(--line);color:var(--sub)}
.badge.d{background:#1968b3;color:#fff}.badge.b{background:#8a6d3b;color:#fff}.badge.s{background:#6b7385;color:#fff}
.sub{color:var(--sub);font-size:13px}
h2{font-size:18px;margin:4px 0 12px}h3{font-size:15px;margin:18px 0 8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
table.t{border-collapse:collapse;width:100%;background:var(--card)}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:middle}
table.t th{font-size:13px;color:var(--sub);font-weight:600}
.hold{opacity:.5}
.scroll{overflow:auto;max-height:calc(100vh - 190px);border:1px solid var(--line);border-radius:12px;background:var(--card)}
table.g{border-collapse:separate;border-spacing:0}
table.g th,table.g td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center;padding:0}
table.g thead th{position:sticky;top:0;background:var(--card);z-index:3;min-width:100px;padding:6px 4px}
.mini .btn{white-space:nowrap}
table.g .qh{position:sticky;left:0;z-index:4;min-width:120px;text-align:left;padding:6px 8px;background:var(--card)}
table.g thead .qh{z-index:5}
table.g td.q{height:44px}
table.g td.q button{width:50%;height:100%;min-height:42px;border:0;background:transparent;font-size:18px;color:#c3c8d2;cursor:pointer;float:left}
table.g td.q.o{background:var(--o)}table.g td.q.o button:first-child{color:var(--ob);font-weight:700}
table.g td.q.x{background:var(--x)}table.g td.q.x button:last-child{color:var(--xb);font-weight:700}
.sc{font-size:18px;font-weight:700}
.mini{display:flex;gap:3px;justify-content:center;margin-top:4px}
.mini input{width:46px;padding:2px 4px;text-align:center;font-size:12px}
.qh .ans{font-weight:600}.qh .un{font-size:12px;color:var(--sub)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;min-width:80px}.bar i{display:block;height:100%;background:var(--pri)}
.bar.low i{background:var(--xb)}
.tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--line);overflow-x:auto}.tabs a{white-space:nowrap}
.tabs a{padding:8px 14px;cursor:pointer;color:var(--sub);border-bottom:2px solid transparent}
.tabs a.on{color:var(--pri);border-color:var(--pri);font-weight:600}
.note{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;color:var(--sub);font-size:13px}
.weak{color:var(--warn)}
#printArea{display:none}
@media print{body>header,body>main{display:none}#printArea{display:block;background:#fff;color:#000;padding:0}#printArea *{color:#000}}
.rep h1{font-size:22px;margin:0 0 4px}.rep table{width:100%;border-collapse:collapse;margin:8px 0}.rep th,.rep td{border:1px solid #bbb;padding:5px 8px;font-size:13px}
@media (max-width:640px){main{padding:10px}.hide-s{display:none}}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}.fg label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--sub)}.fg input{width:100%}
</style>
</head>
<body>
<header><h1 onclick="location.hash='#/'">반 관리</h1><span id="syncState" class="sub"></span><nav><button class="btn sm" id="backBtn" onclick="goBack()" title="이전 화면으로 (앱 안에서 본 순서대로)">← 뒤로</button><button class="btn sm" id="undoBtn" onclick="undo()" title="직전 동작 되돌리기 (Ctrl+Z)">↶ 되돌리기</button><button class="btn sm" id="redoBtn" onclick="redo()" title="다시 실행">↷</button><button class="btn sm" onclick="location.hash='#/naesin'">내신</button><button class="btn sm" onclick="location.hash='#/'">반</button><button class="btn sm" onclick="location.hash='#/backup'">백업</button></nav></header>
<main id="app"></main>
<div id="printArea"></div>
<script src="roster.js"></script>
<script src="firebase-config.js"></script>
<script>
/* ===== 저장소 (지금은 이 기기 localStorage. 나중에 Firebase로 교체할 자리) ===== */
const KEY='banmgmt_v1';
const EMPTY=()=>({exams:[],results:{},memos:{},comments:{},notes:{},att:{},daily:[],lessons:[],roster:null});
let DB=(()=>{try{return Object.assign(EMPTY(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return EMPTY()}})();
function ensureRoster(){ // 처음 한 번만 roster.js(초기 명단)를 복사해 와요. 이후 명단은 앱 안에서 편집한 내용이 기준이에요.
  if(!DB.roster){DB.roster=typeof ROSTER_SEED!=='undefined'?JSON.parse(JSON.stringify(ROSTER_SEED)):{classes:[],students:{}};}
  if(!DB.roster.classes.some(c=>c.id==='ext'))DB.roster.classes.push({id:'ext',name:'외부 학생',days:'',role:'외부',members:[]});
  const AL={daesu:['[IL][GS11]대수상A_월금 17:00'],gong2:['[IL][GS11]공수2상A_월금 17:00'],mijuk:['[IL][GS11]미적1상_화목 17:00'],gstop:['[IL][GSTOP11]중3-2_화목 17:00','GSTOP3-2','GSTOP 중3-2'],pl:['[PL11]중고등_수 17:00'],sun:['[SM11]일요단과A_일 12:30'],jd2:['[SM11]중대기2_일 17:00'],ext:['외부','외부학생']};
  DB.roster.classes.forEach(c=>{if(!c.alias&&AL[c.id])c.alias=AL[c.id]});
}
ensureRoster();
let LAST=JSON.stringify(DB);const UNDO=[],REDO=[];
function updUndo(){const u=document.getElementById('undoBtn'),r=document.getElementById('redoBtn');if(u){u.disabled=!UNDO.length;u.style.opacity=UNDO.length?1:.4}if(r){r.disabled=!REDO.length;r.style.opacity=REDO.length?1:.4}}
function save(){try{const j=JSON.stringify(DB);if(j!==LAST){UNDO.push(LAST);if(UNDO.length>30)UNDO.shift();REDO.length=0;LAST=j}localStorage.setItem(KEY,j);updUndo();schedPush()}catch(e){alert('저장 실패: 백업 파일을 먼저 받아두세요.')}}
function restoreDB(j){DB=Object.assign(EMPTY(),JSON.parse(j));ensureRoster();LAST=j;try{localStorage.setItem(KEY,j)}catch(e){}updUndo();schedPush();render()}
function undo(){if(!UNDO.length)return toast('되돌릴 동작이 없어요');REDO.push(LAST);restoreDB(UNDO.pop());toast('직전 동작을 되돌렸어요')}
function redo(){if(!REDO.length)return toast('다시 실행할 동작이 없어요');UNDO.push(LAST);restoreDB(REDO.pop());toast('다시 실행했어요')}
/* ===== 기기 간 동기화 (서버.py 로 열었을 때만 켜져요) ===== */
const SYNC={on:false,mode:'',rev:0,user:'',timer:null,pending:false,fail:false};
function syncState(t,c){const e=document.getElementById('syncState');if(e){e.textContent=t;e.style.color=c||''}}
function applyRemote(j){DB=Object.assign(EMPTY(),j.db);ensureRoster();LAST=JSON.stringify(DB);UNDO.length=0;REDO.length=0;try{localStorage.setItem(KEY,LAST)}catch(e){}SYNC.rev=j.rev;updUndo();render()}
async function syncInit(){
  if(!/^https?:$/.test(location.protocol))return;
  if(typeof FIREBASE_CONFIG!=='undefined'&&FIREBASE_CONFIG.apiKey)return cloudInit();
  try{
    const r=await fetch('/api/db',{cache:'no-store'});if(!r.ok)throw new Error('no');
    const j=await r.json();SYNC.on=true;
    if(j.db)applyRemote(j);else{SYNC.rev=j.rev;await pushNow()}
    syncState('● 동기화됨','#16a34a');
    setInterval(syncPoll,8000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncPoll()});
  }catch(e){syncState('','')}
}
function schedPush(){if(!SYNC.on)return;SYNC.pending=true;syncState('⟳ 저장 중…','#d97706');clearTimeout(SYNC.timer);SYNC.timer=setTimeout(pushNow,500)}
async function pushNow(){
  if(SYNC.mode==='cloud')return cloudPush();
  try{
    const r=await fetch('/api/db',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({rev:SYNC.rev,db:DB})});
    if(r.status===409){const g=await (await fetch('/api/db',{cache:'no-store'})).json();SYNC.pending=false;applyRemote(g);syncState('● 동기화됨','#16a34a');alert('다른 기기에서 먼저 수정한 내용이 있어서 최신 내용으로 바꿨어요. 방금 입력한 것은 한 번 더 입력해 주세요.');return}
    if(!r.ok)throw new Error('put');
    const j=await r.json();SYNC.rev=j.rev;SYNC.pending=false;SYNC.fail=false;syncState('● 동기화됨','#16a34a');
  }catch(e){SYNC.fail=true;syncState('⚠ 서버 연결 안 됨 (다시 시도 중)','#dc2626');clearTimeout(SYNC.timer);SYNC.timer=setTimeout(pushNow,10000)}
}
async function syncPoll(){
  if(SYNC.mode==='cloud')return cloudPoll();
  if(!SYNC.on||SYNC.pending)return;
  try{
    const j=await (await fetch('/api/rev',{cache:'no-store'})).json();
    if(j.rev>SYNC.rev){
      if(/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||''))return;
      const g=await (await fetch('/api/db',{cache:'no-store'})).json();applyRemote(g);toast('다른 기기의 변경을 불러왔어요');
    }
    if(SYNC.fail){SYNC.fail=false}syncState('● 동기화됨','#16a34a');
  }catch(e){syncState('⚠ 서버 연결 안 됨','#dc2626')}
}
/* ===== 클라우드(Firebase) 동기화: firebase-config.js 에 값이 있을 때만 켜져요 ===== */
let FB=null;
const FB_CDN='https://www.gstatic.com/firebasejs/10.12.2/';
const CHUNK=200000;
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('load '+src));document.head.appendChild(s)})}
function cloudOverlay(html){let o=document.getElementById('cloudOv');if(!o){o=document.createElement('div');o.id='cloudOv';o.style.cssText='position:fixed;left:0;top:0;right:0;bottom:0;z-index:200;background:var(--bg);align-items:center;justify-content:center;padding:16px';document.body.appendChild(o)}o.innerHTML=html;o.style.display=html?'flex':'none'}
const cloudCard=h=>`<div class="card" style="max-width:340px;text-align:center"><h2 style="margin-top:0">반 관리</h2>${h}</div>`;
function chunkStr(s){const out=[];let i=0;while(i<s.length){let e=Math.min(i+CHUNK,s.length);if(e<s.length){const c=s.charCodeAt(e-1);if(c>=0xD800&&c<=0xDBFF)e--}out.push(s.slice(i,e));i=e}return out.length?out:['']}
async function cloudInit(){
  SYNC.mode='cloud';
  cloudOverlay(cloudCard('<p class="sub">불러오는 중…</p>'));
  try{
    if(!window.firebase){for(const f of ['firebase-app-compat.js','firebase-auth-compat.js','firebase-firestore-compat.js'])await loadScript(FB_CDN+f)}
    firebase.initializeApp(FIREBASE_CONFIG);
    const db=firebase.firestore();
    FB={auth:firebase.auth(),db,meta:db.collection('banmgmt').doc('meta'),chunk:i=>db.collection('banmgmt').doc('chunk_'+i)};
    FB.auth.onAuthStateChanged(u=>{if(u)cloudStart(u);else cloudLogin()});
  }catch(e){cloudOverlay(cloudCard('<p class="weak">클라우드에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.</p><button class="btn pri" onclick="location.reload()">다시 시도</button>'))}
}
function cloudLogin(msg){cloudOverlay(cloudCard(`<p class="sub">선생님 구글 계정으로 로그인해 주세요.</p><button class="btn pri" onclick="cloudSignIn()">Google로 로그인</button>${msg?`<p class="weak" style="font-size:13px">${esc(msg)}</p>`:''}`))}
async function cloudSignIn(){try{await FB.auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(e){cloudLogin('로그인하지 못했어요 ('+(e.code||e.message)+')')}}
function cloudLogout(){if(FB)FB.auth.signOut().then(()=>location.reload())}
async function cloudStart(u){
  SYNC.on=true;SYNC.user=u.email||'';
  try{
    const m=await FB.meta.get();
    if(m.exists)await cloudPull(m.data());else{SYNC.rev=0;await cloudPush()}
    cloudOverlay('');syncState('☁ 동기화됨','#16a34a');
    FB.meta.onSnapshot(s=>{if(s.exists&&s.data().rev>SYNC.rev&&!SYNC.pending)cloudPull(s.data(),true)},()=>{});
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)cloudPoll()});
  }catch(e){
    if(e&&e.code==='permission-denied'){await FB.auth.signOut();cloudLogin('이 계정은 사용할 수 없어요. 허용한 구글 계정으로 로그인해 주세요.')}
    else{cloudOverlay('');syncState('⚠ 클라우드 연결 안 됨','#dc2626')}
  }
}
async function cloudPull(meta,quiet){
  const parts=await Promise.all(Array.from({length:meta.n},(_,i)=>FB.chunk(i).get()));
  const json=parts.map(p=>p.data().data).join('');
  if(quiet&&/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||''))return;
  applyRemote({db:JSON.parse(json),rev:meta.rev});
  if(quiet)toast('다른 기기의 변경을 불러왔어요');
}
async function cloudPoll(){
  if(!FB||SYNC.pending)return;
  try{const m=await FB.meta.get();if(m.exists&&m.data().rev>SYNC.rev)await cloudPull(m.data(),true);syncState('☁ 동기화됨','#16a34a')}
  catch(e){syncState('⚠ 클라우드 연결 안 됨','#dc2626')}
}
async function cloudPush(){
  const parts=chunkStr(JSON.stringify(DB)),n=parts.length;
  try{
    const rev=await FB.db.runTransaction(async tx=>{
      const m=await tx.get(FB.meta),cur=m.exists?m.data().rev:0,old=m.exists?m.data().n:0;
      if(cur!==SYNC.rev){const e=new Error('conflict');e.conflict=true;throw e}
      parts.forEach((p,i)=>tx.set(FB.chunk(i),{i,data:p}));
      for(let i=n;i<old;i++)tx.delete(FB.chunk(i));
      tx.set(FB.meta,{rev:cur+1,n,updatedAt:Date.now(),by:SYNC.user||''});
      return cur+1;
    });
    SYNC.rev=rev;SYNC.pending=false;SYNC.fail=false;syncState('☁ 동기화됨','#16a34a');
  }catch(e){
    if(e&&e.conflict){
      const m=await FB.meta.get();SYNC.pending=false;await cloudPull(m.data());syncState('☁ 동기화됨','#16a34a');
      alert('다른 기기에서 먼저 수정한 내용이 있어서 최신 내용으로 바꿨어요. 방금 입력한 것은 한 번 더 입력해 주세요.');return;
    }
    SYNC.fail=true;syncState('⚠ 저장 대기 중 (인터넷 확인)','#dc2626');clearTimeout(SYNC.timer);SYNC.timer=setTimeout(pushNow,10000);
  }
}
document.addEventListener('keydown',e=>{if(!(e.ctrlKey||e.metaKey)||/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||''))return;
  if(e.key==='z'&&!e.shiftKey){e.preventDefault();undo()}else if(e.key==='y'||(e.key==='Z'&&e.shiftKey)){e.preventDefault();redo()}});

/* ===== 유틸 ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const cls=id=>DB.roster.classes.find(c=>c.id===id);
const stu=id=>DB.roster.students[id];
const trkBadge=c=>c.track==='내신'?'<span class="badge" style="background:#b45309;color:#fff">내신 특별반</span>':'';
const roleBadge=r=>`<span class="badge ${r==='담임'?'d':r==='부담임'?'b':'s'}">${esc(r)}</span>`;
const examsOf=cid=>DB.exams.filter(e=>e.classIds.includes(cid)).sort((a,b)=>b.date.localeCompare(a.date));
const EXAM_TYPES=['단원테스트','서술테스트','기출모의고사','학력평가','분기평가','기타'];
const totalPt=e=>e.items.reduce((s,i)=>s+(+i.pt||0),0)+(+e.base||0); // base = 기본점수
function score(e,sid){
  const r=(DB.results[e.id]||{})[sid]; if(!r) return null;
  if(r.total!==undefined&&r.total!==null&&r.total!=='') return +r.total;
  if(!r.m||!r.m.some(v=>v!==null&&v!==undefined)) return null;
  const P=scoreParts(e,sid);return P.base+P.raw+P.part;
}
function qv(r,i){const v0=r&&r.m?r.m[i]:null;if(v0==null)return null;const v=+v0||0;if(v>=1)return 1;if(v>0)return v;return Math.min(1,+((r.p||{})[i])||0)} // 문항 정답 비율(부분점수 포함)
function scoreParts(e,sid){ // {base, raw(정답 배점), part(부분점수), fixed(직접 입력 점수)}
  const r=(DB.results[e.id]||{})[sid];if(!r)return null;
  if(!r.m||!r.m.some(v=>v!=null))return (r.total!=null&&r.total!=='')?{base:0,raw:+r.total,part:0,fixed:true}:null;
  let raw=0,part=0;r.m.forEach((v0,i)=>{const pt=+((e.items[i]||{}).pt)||0,v=+v0||0;if(v>=1)raw+=pt;else if(v>0)part+=pt*v;else part+=pt*Math.min(1,+((r.p||{})[i])||0)});
  const fixed=r.total!=null&&r.total!=='';return {base:+e.base||0,raw,part,fixed};
}
const fmt=n=>n==null?'-':(Math.round(n*10)/10);
function avg(a){a=a.filter(v=>v!=null);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null}
function examAvg(e){const ids=new Set();e.classIds.forEach(c=>cls(c)&&examStudents(e,c).forEach(m=>ids.add(m.id)));return avg([...ids].map(s=>score(e,s)))}
function unitStats(sids,exams,key='unit'){ // {이름:{c,n}}
  const U={};
  exams.forEach(e=>sids.forEach(sid=>{const r=(DB.results[e.id]||{})[sid];if(!r||!r.m)return;
    r.m.forEach((v,i)=>{if(v===null||v===undefined)return;const u=(e.items[i][key]||'').trim()||(key==='kind'?'(유형 미지정)':'(단원 미지정)');
      (U[u]=U[u]||{c:0,n:0}).n++;U[u].c+=qv(r,i);})}));
  return U;
}

function trend(arr){ // 앞쪽 기록 대 최근 기록을 비교해 개선·하락·보완 필요를 판정

  let st;if(recent<60&&d<10)st='보완 필요';else if(d>=15)st='개선됨';else if(d<=-15)st='하락';else if(recent>=80)st='강점';else st=recent<60?'개선 중':'보통';

function fillB(b){const r=b.recs;b.p=avg(r.map(x=>x.p));b.cls=avg(r.map(x=>x.avg==null?x.p:x.avg));
  const ex=r.filter(x=>x.t==='exam'),dl=r.filter(x=>x.t==='daily'),q=r.filter(x=>x.n>=2);
  b.pe=ex.length?avg(ex.map(x=>x.p)):null;b.pd=dl.length?avg(dl.map(x=>x.p)):null;b.rk=q.length?avg(q.map(x=>x.rank/x.n)):null;b.n=r.length;return b}
function bucketsOf(R,mode){

  if(mode==='a'){const all=fillB({label:'전체',recs:R});if(R.length<2)return {cur:all,prev:null,diff:null,all};
    const k=Math.floor(R.length/2),prev=fillB({label:'전반',recs:R.slice(0,k)}),cur=fillB({label:'후반',recs:R.slice(k)});return {cur,prev,diff:cur.p-prev.p,all}}
  const B=bucketsOf(R,mode),cur=B[B.length-1],prev=B[B.length-2]||null;return {cur,prev,diff:prev?cur.p-prev.p:null}
}

}
const seriesP=(sid,key,mode,trk)=>bucketSeries(seriesBy(sid,key,trk),mode);
const statusOf=(recent,d)=>recent<60&&d<10?'보완 필요':d>=15?'개선됨':d<=-15?'하락':recent>=80?'강점':recent<60?'개선 중':'보통';
function trendLast(arr){ // 가장 최근 기간 대 그 이전 기간 전체
  const tot=a=>{const c=a.reduce((s,x)=>s+x.c,0),n=a.reduce((s,x)=>s+x.n,0);return n?c/n*100:null};
  const all=tot(arr);
  if(arr.length<2)return {all,recent:all,early:null,d:null,st:all<60?'보완 필요':all>=80?'강점':'보통'};
  const recent=tot(arr.slice(-1)),early=tot(arr.slice(0,-1)),d=recent-early;
  return {all,recent,early,d,st:statusOf(recent,d)};
}
const trendFor=mode=>mode==='a'?trend:trendLast;
function autoComment(sid,mode,trk){
  mode=mode||GP;const R=recsOf(sid,trk),S=periodSummary(R,mode),L=[];
  const nm={m:['이번 달','지난달'],q:['이번 분기','지난 분기'],a:['후반 기록','전반 기록']}[mode];
  if(S.diff==null)L.push(`성적: 기록 ${R.length}회, ${mode==='a'?'전체':S.cur.label} 평균 ${f0(S.cur.p)}%예요. 비교할 이전 기간이 쌓이면 변화를 보여드려요.`);
  else L.push(`성적: ${nm[0]}${mode==='a'?'':'('+S.cur.label+')'} 평균 ${f0(S.cur.p)}%로 ${nm[1]}(${f0(S.prev.p)}%)보다 ${S.diff>=5?'올랐어요 ('+sgn(S.diff)+'%p).':S.diff<=-5?'내려갔어요 ('+sgn(S.diff)+'%p). 원인 확인이 필요해요.':'비슷해요 ('+sgn(S.diff)+'%p).'}`);
  if(S.cur.rk!=null&&S.prev&&S.prev.rk!=null)L.push(`반 안 위치: ${nm[0]} 상위 ${Math.round(S.cur.rk*100)}% (${nm[1]} 상위 ${Math.round(S.prev.rk*100)}%).`);
  const tf=trendFor(mode),pick=(S0,...sts)=>Object.entries(S0).filter(([k,a])=>sts.includes(tf(a).st)).map(([k])=>k);
  const U=seriesP(sid,'unit',mode,trk),K=seriesP(sid,'kind',mode,trk);
  const add=(label,names,msg)=>{if(names.length)L.push(`${label}: ${names.join(', ')} — ${msg}`)};
  add('보완 필요 단원',pick(U,'보완 필요'),'정답률이 낮고 아직 나아지지 않았어요. 우선 보강하세요.');
  add('하락한 단원',pick(U,'하락'),'이전보다 떨어졌어요. 복습이 필요해요.');
  add('개선 중인 단원',pick(U,'개선 중'),'오르는 중이지만 아직 60%에 못 미쳐요.');
  add('개선된 단원',pick(U,'개선됨'),'이전보다 확실히 좋아졌어요. 유지하도록 격려하세요.');
  add('강점 단원',pick(U,'강점'),'안정적이에요.');
  add('보완 필요 유형',pick(K,'보완 필요','하락'),'유형 연습이 필요해요.');
  add('개선된 유형',pick(K,'개선됨'),'좋아지고 있어요.');
  if(L.length<=2)L.push('단원·유형 정보가 있는 기록이 늘면 개선 여부를 자세히 진단해요.');
  return L.join('\n');
}

/* --- 그래프 --- */
function lineChart(R){
  if(!R.length) return '<span class="sub">기록 없음</span>';
  const W=640,H=220,P=34,n=R.length,x=i=>n===1?W/2:P+i*(W-2*P)/(n-1),y=v=>H-P-(Math.max(0,Math.min(100,v))/100)*(H-2*P),step=Math.ceil(n/10);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:700px">${[0,50,100].map(v=>`<line x1="${P}" x2="${W-P}" y1="${y(v)}" y2="${y(v)}" stroke="#8884"/><text x="4" y="${y(v)+4}" font-size="11" fill="#888">${v}</text>`).join('')}
  <polyline fill="none" stroke="#888" stroke-dasharray="4 4" points="${R.map((r,i)=>x(i)+','+y(r.avg==null?r.p:r.avg)).join(' ')}"/>
  <polyline fill="none" stroke="#1968b3" stroke-width="2.5" points="${R.map((r,i)=>x(i)+','+y(r.p)).join(' ')}"/>
  ${R.map((r,i)=>`<circle cx="${x(i)}" cy="${y(r.p)}" r="${r.t==='exam'?5:3.5}" fill="${r.t==='exam'?'#1968b3':'#fff'}" stroke="#1968b3" stroke-width="2"/>${(r.t==='exam'||n<=12)?`<text x="${x(i)}" y="${y(r.p)-9}" font-size="11" text-anchor="middle" fill="#1968b3">${r.max===100?f0(r.p):fmt(r.sc)+'/'+fmt(r.max)}</text>`:''}${i%step===0?`<text x="${x(i)}" y="${H-10}" font-size="10" text-anchor="middle" fill="#888">${esc(r.date.slice(5))}</text>`:''}`).join('')}</svg>
  <div class="sub">큰 점 = 정규시험, 작은 흰 점 = 일일테스트 · 파랑 본인 · 점선 반 평균 · 글자는 실제 점수(예: 8/10), 세로 위치는 만점 대비 %</div>`;
}
function rankChart(R){
  const Q=R.filter(r=>r.n>=2);
  if(!Q.length) return '<span class="sub">같은 반에서 2명 이상 응시한 기록이 있으면 등수가 표시돼요.</span>';
  const W=640,H=170,P=34,n=Q.length,x=i=>n===1?W/2:P+i*(W-2*P)/(n-1),y=r=>P/2+((r.rank-1)/Math.max(1,r.n-1))*(H-P*1.6),step=Math.ceil(n/10);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:700px"><text x="4" y="${P/2+4}" font-size="11" fill="#888">1등</text><text x="4" y="${H-P*1.1+4}" font-size="11" fill="#888">꼴등</text>
  <polyline fill="none" stroke="#16a34a" stroke-width="2.5" points="${Q.map((r,i)=>x(i)+','+y(r)).join(' ')}"/>
  ${Q.map((r,i)=>`<circle cx="${x(i)}" cy="${y(r)}" r="4.5" fill="#16a34a"/><text x="${x(i)}" y="${y(r)-9}" font-size="11" text-anchor="middle" fill="#16a34a">${r.rank}/${r.n}</text>${i%step===0?`<text x="${x(i)}" y="${H-8}" font-size="10" text-anchor="middle" fill="#888">${esc(r.date.slice(5))}</text>`:''}`).join('')}</svg><div class="sub">위쪽일수록 반 안 순위가 높아요.</div>`;
}
function spark(R){
  const Q=R.slice(-10);if(Q.length<2)return '<span class="sub">-</span>';
  const W=90,H=26,x=i=>2+i*(W-4)/(Q.length-1),y=v=>H-3-(Math.max(0,Math.min(100,v))/100)*(H-6);
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><polyline fill="none" stroke="#1968b3" stroke-width="2" points="${Q.map((r,i)=>x(i)+','+y(r.p)).join(' ')}"/><circle cx="${x(Q.length-1)}" cy="${y(Q[Q.length-1].p)}" r="2.5" fill="#1968b3"/></svg>`;
}
const stOrder={'보완 필요':0,'하락':1,'개선 중':2,'보통':3,'개선됨':4,'강점':5};
const heat=p=>p>=80?'#16a34a33':p>=60?'#d9770633':'#dc262633';
function trendMatrix(S,label,mode){
  const names=Object.keys(S);

  const rows=names.map(k=>({k,a:S[k],t:tf(S[k])})).sort((x,y)=>(stOrder[x.t.st]-stOrder[y.t.st])||(x.t.recent-y.t.recent));
  const cell=p=>p==null?'<td style="text-align:center;color:#bbb">·</td>':`<td style="text-align:center;background:${heat(p)}">${f0(p)}</td>`;
  const head=mode==='a'?'<th style="text-align:center">전체</th>':bk.map(b=>`<th style="text-align:center">${bLabel(b,mode)}</th>`).join('');

}
function barChart(B){
  if(!B.length)return '';
  const W=640,H=220,P=34,n=B.length,bw=Math.min(64,(W-2*P)/n*0.6),x=i=>P+(i+.5)*(W-2*P)/n,y=v=>H-P-(Math.max(0,Math.min(100,v))/100)*(H-2*P);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:700px">${[0,50,100].map(v=>`<line x1="${P}" x2="${W-P}" y1="${y(v)}" y2="${y(v)}" stroke="#8884"/><text x="4" y="${y(v)+4}" font-size="11" fill="#888">${v}</text>`).join('')}
  ${B.map((b,i)=>`<rect x="${x(i)-bw/2}" y="${y(b.p)}" width="${bw}" height="${H-P-y(b.p)}" rx="3" fill="#1968b3"/><text x="${x(i)}" y="${y(b.p)-6}" font-size="11" text-anchor="middle" fill="#1968b3">${f0(b.p)}%</text><text x="${x(i)}" y="${H-12}" font-size="10" text-anchor="middle" fill="#888">${esc(b.label)}</text>`).join('')}
  <polyline fill="none" stroke="#888" stroke-dasharray="4 4" points="${B.map((b,i)=>x(i)+','+y(b.cls)).join(' ')}"/>${B.map((b,i)=>`<circle cx="${x(i)}" cy="${y(b.cls)}" r="3" fill="#888"/>`).join('')}</svg><div class="sub">막대 = 본인 평균(만점 대비 %), 점선 = 반 평균</div>`;
}
function bucketTable(B){
  return `<table class="t"><tr><th>기간</th><th>기록</th><th>평균</th><th class="hide-s">정규</th><th class="hide-s">일일</th><th>반 평균</th><th>변화</th><th>반 안 위치</th></tr>${B.map((b,i)=>{const d=i?b.p-B[i-1].p:null;return `<tr><td>${esc(b.label)}</td><td>${b.n}</td><td><b>${f0(b.p)}%</b></td><td class="hide-s">${pctS(b.pe)}</td><td class="hide-s">${pctS(b.pd)}</td><td>${pctS(b.cls)}</td><td style="color:${d==null?'#888':d>0?'#16a34a':d<0?'#dc2626':'#888'}">${d==null?'-':sgn(d)+'%p'}</td><td>${b.rk==null?'-':'상위 '+Math.round(b.rk*100)+'%'}</td></tr>`}).join('')}</table>`;
}
const periodBtns=(mode)=>`<div class="row" style="margin-bottom:10px">${[['m','월별'],['q','분기별'],['a','전체']].map(([m,t])=>`<button class="btn sm ${mode===m?'pri':''}" onclick="setGP('${m}')">${t}</button>`).join('')}<span class="sub">분기는 1~3월·4~6월·7~9월·10~12월 기준이에요.</span></div>`;
function recTable(R){
  return `<table class="t"><tr><th>날짜</th><th>구분</th><th>시험·단원</th><th>점수</th><th>반 내 등수</th><th class="hide-s">반 평균</th></tr>${R.slice().reverse().map(r=>`<tr><td>${esc(r.date)}</td><td>${r.t==='exam'?'정규':'일일'}</td><td>${esc(r.name)}</td><td><b>${fmt(r.sc)}</b>/${fmt(r.max)} <span class="sub">(${f0(r.p)}%)</span></td><td>${r.n>=2?r.rank+'/'+r.n:'-'}</td><td class="hide-s">${fmt(Math.round(r.avg/100*r.max*10)/10)}</td></tr>`).join('')}</table>`;
}
function growthBlock(sid,trk){
  const R=recsOf(sid,trk);
  if(!R.length) return '<p class="note">아직 성적 기록이 없어요. 시험 결과나 일일테스트 점수가 등록되면 성장 그래프와 진단이 나타나요.</p>';
  const mode=GP,B=bucketsOf(R,mode),S=periodSummary(R,mode);

  const chip=(t,v,s)=>`<div class="card" style="flex:1;min-width:140px"><div class="sub">${t}</div><div class="sc">${v}</div><div class="sub">${s||''}</div></div>`;
  const first=mode==='a'?S.all:S.cur;
  return `${periodBtns(mode)}<div class="row">${chip(mode==='a'?'전체 평균':esc(S.cur.label)+' 평균',f0(first.p)+'%',S.diff==null?'비교할 이전 기간 없음':sgn(S.diff)+'%p ('+(mode==='a'?'후반 vs 전반':cmp+' 대비')+')')}${chip('반 안 위치',S.cur.rk==null?'-':'상위 '+Math.round(S.cur.rk*100)+'%',S.prev&&S.prev.rk!=null?(mode==='a'?'전반':cmp)+' 상위 '+Math.round(S.prev.rk*100)+'%':'')}${chip('누적 기록',R.length+'회',R[0].date+' ~ '+R[R.length-1].date)}</div>
  <h3>성장·약점 진단</h3><div class="card" style="white-space:pre-wrap">${esc(autoComment(sid,mode,trk))}</div>
  <h3>${mode==='m'?'월별':mode==='q'?'분기별':'전체 기록'} 점수</h3><div class="card">${mode==='a'?lineChart(R):barChart(B)}</div>
  ${mode==='a'?`<h3>월별 요약</h3>${bucketTable(bucketsOf(R,'m'))}<h3>분기별 요약</h3>${bucketTable(bucketsOf(R,'q'))}`:`<h3>${mode==='m'?'월별':'분기별'} 표</h3>${bucketTable(B)}`}
  <h3>반 내 등수 추이 (전체 기록)</h3><div class="card">${rankChart(R)}</div>

  <h3>전체 기록 상세</h3>${recTable(R)}`;
}

/* ===== 일일테스트 탭 ===== */
function dSum(d){const v=Object.values(d.scores).filter(x=>x!==''&&x!=null).map(Number);if(!v.length)return '아직 입력된 점수가 없어요.';
  return `응시 ${v.length}명 · 평균 ${fmt(avg(v))}/${d.max} (${f0(avg(v)/d.max*100)}%) · 최고 ${fmt(Math.max(...v))} · 최저 ${fmt(Math.min(...v))}`}
function dailyPage(app,c){

  <datalist id="ul">${allUnits().map(u=>`<option value="${esc(u)}">`).join('')}</datalist><datalist id="kl">${allKinds().map(u=>`<option value="${esc(u)}">`).join('')}</datalist>
  ${list.map(d=>dailyCard(c,d)).join('')||'<p class="note">아직 일일테스트 기록이 없어요. 점수 이미지를 Claude에게 주면 한 번에 등록해 드려요.</p>'}`;
}
function dailyCard(c,d){
  const ids=[...new Set([...c.members.filter(m=>!m.hold||(d.scores[m.id]!==undefined&&d.scores[m.id]!=='')).map(m=>m.id),...Object.keys(d.scores).filter(s=>stu(s))])].sort((a,b)=>stu(a).name.localeCompare(stu(b).name,'ko'));

  <div class="sub" id="dsum-${d.id}" style="margin:8px 0">${dSum(d)}</div>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px">${ids.map(sid=>`<label class="row" style="border:1px solid var(--line);border-radius:8px;padding:4px 8px;justify-content:space-between;flex-wrap:nowrap"><span>${esc(stu(sid).name)}</span><input type="number" step="0.5" inputmode="decimal" style="width:64px" value="${d.scores[sid]==null?'':d.scores[sid]}" onchange="setDScore('${d.id}','${sid}',this.value)"></label>`).join('')}</div></div>`;
}
const dById=id=>DB.daily.find(d=>d.id===id);
function addDaily(cid){DB.daily.push({id:uid(),cid,date:today(),unit:'',kind:'',max:100,memo:'',scores:{}});save();render()}
function setD(id,f,v){const d=dById(id);d[f]=f==='max'?(+v||100):v.trim?v.trim():v;save();const e=document.getElementById('dsum-'+id);if(e)e.textContent=dSum(d)}
function setDScore(id,sid,v){const d=dById(id);if(v==='')delete d.scores[sid];else d.scores[sid]=+v;save();const e=document.getElementById('dsum-'+id);if(e)e.textContent=dSum(d)}
function delDaily(id){if(!confirm('이 일일테스트 기록을 삭제할까요?'))return;DB.daily=DB.daily.filter(d=>d.id!==id);save();render()}

/* ===== 반 리포트 탭 ===== */
function sparkV(vals){
  if(vals.length<2)return '<span class="sub">-</span>';
  const V=vals.slice(-10),W=90,H=26,x=i=>2+i*(W-4)/(V.length-1),y=v=>H-3-(Math.max(0,Math.min(100,v))/100)*(H-6);
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><polyline fill="none" stroke="#1968b3" stroke-width="2" points="${V.map((v,i)=>x(i)+','+y(v)).join(' ')}"/><circle cx="${x(V.length-1)}" cy="${y(V[V.length-1])}" r="2.5" fill="#1968b3"/></svg>`;
}
function reportPage(app,c){
  const mode=GP,tf=trendFor(mode),trk=c.track==='내신'?'내신':undefined;
  const info=c.members.map(m=>({m,R:recsOf(m.id,trk)}));
  const keys=mode==='a'?[]:[...new Set(info.flatMap(x=>x.R.map(r=>bKey(r.date,mode))))].sort();
  const ck=keys[keys.length-1],pk=keys[keys.length-2];
  const rows=info.map(({m,R})=>{
    let cur=null,prev=null,vals;
    if(mode==='a'){const S=R.length?periodSummary(R,'a'):null;cur=S?S.all.p:null;prev=S&&S.prev?S.prev.p:null;vals=R.map(r=>r.p);if(S&&S.diff!=null){cur=S.all.p}}
    else{const B=bucketsOf(R,mode);const bc=B.find(b=>b.key===ck),bp=B.find(b=>b.key===pk);cur=bc?bc.p:null;prev=bp?bp.p:null;vals=B.map(b=>b.p)}
    const diff=(mode==='a'?(R.length>=2?periodSummary(R,'a').diff:null):(cur!=null&&prev!=null?cur-prev:null));
    const ts=Object.entries(seriesP(m.id,'unit',mode,trk)).map(([k,a])=>[k,tf(a).st]);
    return {m,R,cur,prev,diff,vals,weak:ts.filter(x=>x[1]==='보완 필요'||x[1]==='하락').map(x=>x[0]).slice(0,3),up:ts.filter(x=>x[1]==='개선됨').map(x=>x[0]).slice(0,3)}});
  rows.sort((a,b)=>(b.cur==null?-1:b.cur)-(a.cur==null?-1:a.cur));
  const merge=key=>{const S={};c.members.forEach(m=>Object.entries(seriesBy(m.id,key,trk)).forEach(([k,a])=>(S[k]=S[k]||[]).push(...a)));Object.values(S).forEach(a=>a.sort((x,y)=>x.date.localeCompare(y.date)));return bucketSeries(S,mode)};
  const curL=mode==='a'?'전체 평균':(ck?bLabel(ck,mode):'최근')+' 평균',prevL=mode==='a'?'전반':(pk?bLabel(pk,mode):'이전');
  app.innerHTML=`<div class="row"><h2 style="margin:0">${esc(c.name)}</h2>${roleBadge(c.role)+trkBadge(c)}<span class="sub">${c.days?esc(c.days)+' · ':''}${c.members.length}명${periodTxt(c)}</span></div>${classTabs(c.id,'report',c)}

  <h3>반 전체 단원별 흐름</h3>${trendMatrix(merge('unit'),'단원',mode)}<h3>반 전체 유형별 흐름</h3>${trendMatrix(merge('kind'),'유형',mode)}`;
}
/* ===== 수업 기록 (오늘 계획 → 실제 진행 → 숙제 → TEST, 지난 수업 이어보기) ===== */
const LM=c=>c.lessonMode||(/PL|단과/.test(c.name)?'indiv':'class');
const CHK={o:['완료','#16a34a'],p:['일부','#d97706'],x:['미제출','#dc2626']};
const hasTest=p=>p&&p.test!==undefined&&p.test!==null&&p.test!=='';
const lessonOf=(cid,d)=>DB.lessons.find(l=>l.cid===cid&&l.date===d);
const lessonHas=l=>!!(l.unit||l.plan||l.done||l.hw||l.memo||Object.values(l.per||{}).some(p=>p&&(p.plan||p.done||p.hw||p.chk||p.note||hasTest(p))));
function ensureLesson(cid,d){let l=lessonOf(cid,d);if(!l){l={id:uid(),cid,date:d,unit:'',plan:'',done:'',hw:'',memo:'',tunit:'',tkind:'',tmax:100,per:{},sids:[]};DB.lessons.push(l)}
  const c=cls(cid);if(c){const st=new Set(l.sids||[]);c.members.forEach(m=>st.add(m.id));l.sids=[...st]}return l}
function lessonStudents(c,l){ // 옛 날짜는 그때 수업을 들은 학생까지 보여줘요
  const ids=new Set(c.members.filter(m=>!m.hold).map(m=>m.id));
  if(l){(l.sids||[]).forEach(x=>ids.add(x));Object.keys(l.per||{}).forEach(x=>ids.add(x))}
  return [...ids].filter(x=>stu(x)&&(!stu(x).archived||(l&&l.per&&l.per[x]))).sort((a,b)=>stu(a).name.localeCompare(stu(b).name,'ko')).map(id=>({id,hold:false}))}
const prevLesson=(cid,d)=>DB.lessons.filter(l=>l.cid===cid&&l.date<d&&lessonHas(l)).sort((a,b)=>b.date.localeCompare(a.date))[0];
function prevStu(c,d,sid){ // 이 학생의 직전 수업(전날이 아니라 '지난 수업')
  const L=DB.lessons.filter(l=>l.cid===c.id&&l.date<d).sort((a,b)=>b.date.localeCompare(a.date));
  for(const l of L){const p=(l.per||{})[sid]||{};
    if(LM(c)==='indiv'){if(p.done||p.plan||p.hw)return {date:l.date,done:p.done||'',plan:p.plan||'',hw:p.hw||''}}
    else if(l.done||l.plan||l.hw)return {date:l.date,done:l.done||'',plan:l.plan||'',hw:l.hw||''}}
  return null;
}
function stepClassDay(c,d,dir){let t=d;for(let i=0;i<14;i++){t=shiftDate(t,dir);if(!c.days||c.days.includes(DOW[new Date(t+'T00:00:00').getDay()]))return t}return shiftDate(d,dir)}
const dowOf=d=>DOW[new Date(d+'T00:00:00').getDay()];
const mdd=d=>`${+d.slice(5,7)}/${+d.slice(8)}(${dowOf(d)})`;

let MSGS=[];
function buildMsg(c,l,sid){
  const s=stu(sid),p=(l.per||{})[sid]||{},mode=LM(c),att=(attDay(c.id,l.date)[sid]||{});
  const done=mode==='indiv'?(p.done||p.plan):(l.done||l.plan),hw=mode==='indiv'?p.hw:l.hw;
  const L=[`[${s.name} 학생] ${mdd(l.date)} 수업 안내`];
  if(att.s==='a'){L.push('오늘 결석했습니다.'+(done?` 오늘 진행 내용: ${done}`:''));if(hw)L.push('숙제: '+hw);L.push('다음 수업 전에 보충 방법을 안내드리겠습니다.');return L.join('\n')}
  if(att.s==='l')L.push('• 오늘 지각했습니다.');
  if(mode!=='indiv'&&l.unit)L.push('• 단원: '+l.unit);
  if(done)L.push('• 오늘 진행: '+done);
  if(p.chk)L.push('• 지난 숙제: '+({o:'잘 해왔어요',p:'일부만 해왔어요',x:'해오지 못했어요'}[p.chk]));
  if(hasTest(p))L.push(`• TEST: ${p.test}/${l.tmax||100}점`);
  if(hw)L.push('• 숙제: '+hw);
  if(p.note)L.push('• '+p.note);
  return L.join('\n');
}
function buildClassMsg(c,l){
  const L=[`[${c.name}] ${mdd(l.date)} 수업 안내`];
  if(l.unit)L.push('• 단원: '+l.unit);
  if(l.done||l.plan)L.push('• 오늘 진행: '+(l.done||l.plan));
  if(l.hw)L.push('• 숙제: '+l.hw);
  if(l.memo)L.push('• '+l.memo);
  return L.join('\n');
}
function toast(m){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d2330;color:#fff;padding:8px 16px;border-radius:99px;z-index:99;font-size:14px';document.body.appendChild(t)}t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',1600)}
function copyText(t){
  const fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('복사했어요')}catch(e){alert('복사 실패: 직접 선택해서 복사해 주세요.')}a.remove()};

/* ===== 반 이름으로 자동 분류 · 이미지에서 읽은 기록 가져오기 ===== */
const normC=s=>String(s||'').toLowerCase().replace(/[\s_\-\[\]\(\)·.,:]/g,'');
function resolveClass(k){ // 반 id · 이름 · 별칭(엑셀 반 이름) · 일부 단어 모두 허용
  if(!k)return null;let c=cls(k);if(c)return c;
  const toks=String(k).split(/[\s_\-\/,]+/).map(normC).filter(Boolean);if(!toks.length)return null;
  const cand=DB.roster.classes.filter(x=>{const hay=normC([x.name,...(x.alias||[])].join(' '));return toks.every(t=>hay.includes(t))});
  const act=cand.filter(x=>!x.archived),pool=act.length?act:cand;
  if(pool.length===1)return pool[0];
  const ex=pool.filter(x=>normC(x.name)===normC(k));return ex.length===1?ex[0]:null;
}
function findMember(c,k){const m=c.members.find(m=>m.id===k||stu(m.id).eid===k)||c.members.find(m=>stu(m.id).name===k);return m&&m.id}
const CHKMAP={o:'o',p:'p',x:'x','완료':'o','일부':'p','미제출':'x','미':'x','○':'o','△':'p','✕':'x'};
const ATTMAP={p:'p',l:'l',a:'a',e:'e','출석':'p','지각':'l','결석':'a','조퇴':'e'};
function importDaily(d){
  const made=[],miss=[];let cnt=0,first=null;
  d.daily.forEach(x=>{const k=x.cid||x.classId||x.class,c=resolveClass(k);if(!c){miss.push('반 '+k);return}first=first||c.id;const cid=c.id;
    const date=x.date||today(),unit=x.unit||'',kind=x.kind||'';
    let e=DB.daily.find(y=>y.cid===cid&&y.date===date&&y.unit===unit&&y.kind===kind);
    if(!e){e={id:uid(),cid,date,unit,kind,max:+x.max||100,memo:x.memo||'',scores:{}};DB.daily.push(e)}else{e.max=+x.max||e.max;if(x.memo!==undefined)e.memo=x.memo}
    Object.entries(x.scores||{}).forEach(([kk,v])=>{let sid=findMember(c,kk);
      if(!sid){if(c.role==='외부'){sid=addStudent({name:kk});addToClass(cid,sid);made.push(kk)}else{miss.push(kk);return}}
      e.scores[sid]=+v;cnt++})});
  return {msg:`일일테스트 점수 ${cnt}건`+(made.length?` (새 학생: ${made.join(', ')})`:'')+(miss.length?`\n명단·반에 없음(건너뜀): ${miss.join(', ')}`:''),go:first?'#/class/'+first+'?tab=daily':null};
}
function importLessons(d){
  const miss=[];let cnt=0,first=null,fd=null;
  d.lessons.forEach(x=>{const k=x.class||x.cid||x.classId,c=resolveClass(k);if(!c){miss.push('반 '+k);return}
    const date=x.date||today();first=first||c.id;fd=fd||date;const l=ensureLesson(c.id,date);
    ['unit','plan','done','hw','memo','tunit','tkind'].forEach(f=>{if(x[f]!==undefined)l[f]=String(x[f])});if(x.tmax)l.tmax=+x.tmax;
    Object.entries(x.per||{}).forEach(([kk,v])=>{const sid=findMember(c,kk);if(!sid){miss.push(kk);return}
      const p=(l.per[sid]=l.per[sid]||{});['plan','done','hw','note'].forEach(f=>{if(v[f]!==undefined)p[f]=String(v[f])});
      if(v.test!==undefined&&v.test!=='')p.test=+v.test;if(v.chk)p.chk=CHKMAP[v.chk]||'';cnt++})});
  return {msg:`수업 기록 ${d.lessons.length}건(학생별 ${cnt}건)`+(miss.length?`\n명단·반에 없음(건너뜀): ${miss.join(', ')}`:''),go:first?'#/class/'+first+'?tab=lesson&d='+fd:null};
}
function importAtt(d){
  const miss=[];let cnt=0,first=null,fd=null;
  d.att.forEach(x=>{const k=x.class||x.cid||x.classId,c=resolveClass(k);if(!c){miss.push('반 '+k);return}
    const date=x.date||today();first=first||c.id;fd=fd||date;
    const D=(DB.att[c.id]=DB.att[c.id]||{}),day=(D[date]=D[date]||{});
    Object.entries(x.records||{}).forEach(([kk,v])=>{const sid=findMember(c,kk);if(!sid){miss.push(kk);return}
      const o=(v&&typeof v==='object')?v:{s:v},s=ATTMAP[o.s]||'';if(!s&&!o.n)return;day[sid]={s,n:o.n||''};cnt++})});
  return {msg:`출결 ${cnt}건`+(miss.length?`\n명단·반에 없음(건너뜀): ${miss.join(', ')}`:''),go:first?'#/class/'+first+'?tab=att&d='+fd:null};
}
function importBundle(d){ // 한 파일에 일일테스트·수업 기록·출결이 함께 있어도 처리

function attMonthStats(c,ym){
  const D=DB.att[c.id]||{},N=daysIn(ym),td=today();
  const dates=Array.from({length:N},(_,i)=>`${ym}-${String(i+1).padStart(2,'0')}`);
  const isReg=d=>!!c.days&&c.days.includes(DOW[new Date(d+'T00:00:00').getDay()]);
  const has=d=>!!D[d]&&Object.values(D[d]).some(r=>r&&r.s);
  const cols=dates.filter(d=>isReg(d)||has(d));
  const ids=[...new Set([...c.members.filter(m=>!m.hold).map(m=>m.id),...dates.flatMap(d=>Object.keys(D[d]||{}))])].filter(stu);
  ids.sort((a,b)=>stu(a).name.localeCompare(stu(b).name,'ko'));
  const rows=ids.map(sid=>{const k={p:0,l:0,a:0,e:0};cols.forEach(d=>{const r=(D[d]||{})[sid];if(r&&r.s)k[r.s]++});
    const rec=k.p+k.l+k.a+k.e,rate=rec?Math.round((k.p+k.l+k.e)/rec*100):null;return {sid,k,rec,rate}});
  const tot={p:0,l:0,a:0,e:0};rows.forEach(r=>{['p','l','a','e'].forEach(x=>tot[x]+=r.k[x])});
  const rec=tot.p+tot.l+tot.a+tot.e;
  return {D,dates,cols,rows,tot,td,has,isReg,rate:rec?Math.round((tot.p+tot.l+tot.e)/rec*100):null,inputDays:cols.filter(has).length,regDays:cols.filter(d=>isReg(d)&&d<=td).length};
}

const isNaesinCls=cid=>((cls(cid)||{}).track==='내신');
const matchTrack=(cid,trk)=>trk==='내신'?isNaesinCls(cid):!isNaesinCls(cid);
const avgP=a=>{const v=a.filter(x=>x!=null&&!isNaN(x));return v.length?v.reduce((s,x)=>s+x,0)/v.length:null};
/* 문항·점수 단위 기록(단원·유형 분석용): cid 가 있으면 그 반(내신반)의 기록, 없으면 정규 기록 */
function cellsOf(sids,cid,cat){
  const S=new Set(sids),out=[];
  const ok=c=>cid?c===cid:!isNaesinCls(c);
  DB.exams.forEach(e=>{const R=DB.results[e.id]||{};Object.keys(R).forEach(sid=>{if(!S.has(sid))return;if(!ok(examClass(e,sid)))return;if(cat&&e.type!==cat)return;const r=R[sid];if(!r||!r.m)return;
    r.m.forEach((v,i)=>{if(v==null)return;const it=e.items[i];out.push({sid,type:e.type,unit:(it.unit||'').trim(),kind:(it.kind||'').trim(),c:qv(r,i),n:1,src:e.name,date:e.date,q:i+1,ans:it.ans||''})})})});
  DB.daily.forEach(d=>{if(cat||!ok(d.cid))return;Object.entries(d.scores).forEach(([sid,v])=>{if(!S.has(sid)||v===''||v==null)return;out.push({sid,type:'일일테스트',unit:(d.unit||'').trim(),kind:(d.kind||'').trim(),c:+v,n:+d.max||100,src:'일일테스트 '+d.date,date:d.date,q:null,ans:''})})});
  DB.lessons.forEach(l=>{if(cat||!ok(l.cid))return;Object.entries(l.per||{}).forEach(([sid,p])=>{if(!S.has(sid)||!hasTest(p))return;out.push({sid,type:'수업 TEST',unit:(l.tunit||'').trim(),kind:(l.tkind||'').trim(),c:+p.test,n:+l.tmax||100,src:'수업 TEST '+l.date,date:l.date,q:null,ans:''})})});
  return out;
}
function tally(cells,key){const T={};cells.forEach(x=>{const k=x[key]||(key==='kind'?'(유형 미지정)':'(단원 미지정)');const t=(T[k]=T[k]||{c:0,n:0,q:0});t.c+=x.c;t.n+=x.n;t.q++});return T}
const pcOf=t=>t&&t.n?t.c/t.n*100:null;
const dTxt=(d)=>d==null?'-':`<span style="color:${d>0?'#16a34a':d<0?'#dc2626':'#888'}">${sgn(d)}%p</span>`;
let NBRIEF='';
function naesinPage(app,cid,cat){
  cat=cat||'';
  const list=DB.roster.classes.filter(c=>c.track==='내신');
  if(!list.length){app.innerHTML=`<h2>내신 관리</h2><p class="note">내신 특별반이 아직 없어요. 반 설정에서 <b>"내신 특별반"</b>을 체크하면 그 반의 기록이 정규 기록과 따로 보관되고, 여기서 정규 대비 비교·단원 보고서·유형 보고서를 볼 수 있어요.</p>`;return}
  const c=(cid&&cls(cid)&&cls(cid).track==='내신'?cls(cid):null)||list.filter(x=>!x.archived)[0]||list[0];
  const sids=c.members.map(m=>m.id);
  const N=cellsOf(sids,c.id,cat),NA=cat?cellsOf(sids,c.id):N,RR=cellsOf(sids,null);
  const R=c.start?RR.filter(x=>x.date<c.start):RR,Rb=R.length?R:RR;
  const nU=tally(N,'unit'),rU=tally(Rb,'unit'),nK=tally(N,'kind'),rK=tally(Rb,'kind');
  const nAll={c:N.reduce((s,x)=>s+x.c,0),n:N.reduce((s,x)=>s+x.n,0)},rAll={c:Rb.reduce((s,x)=>s+x.c,0),n:Rb.reduce((s,x)=>s+x.n,0)};
  const D=DB.att[c.id]||{};
  const stRows=sids.map(sid=>{
    const nr=recsOf(sid,'내신').filter(r=>r.cid===c.id&&(!cat||r.type===cat));let rr=recsOf(sid).filter(r=>!c.start||r.date<c.start);if(!rr.length)rr=recsOf(sid);
    const np=avgP(nr.map(r=>r.p)),rp=avgP(rr.map(r=>r.p));
    const k={p:0,l:0,a:0,e:0};Object.values(D).forEach(day=>{const x=day[sid];if(x&&x.s)k[x.s]++});const rec=k.p+k.l+k.a+k.e;
    const mine=N.filter(x=>x.sid===sid),wk=(key)=>Object.entries(tally(mine,key)).filter(([n,t])=>t.q>=2&&pcOf(t)<60).sort((a,b)=>pcOf(a[1])-pcOf(b[1])).slice(0,2).map(([n,t])=>`${n} ${Math.round(pcOf(t))}%`);
    return {sid,np,rp,diff:(np!=null&&rp!=null)?np-rp:null,nrec:nr.length,rate:rec?Math.round((k.p+k.l+k.e)/rec*100):null,wk:wk('kind'),wu:wk('unit'),orig:classesOf(sid).filter(x=>x.id!==c.id).map(x=>x.name)};
  }).sort((a,b)=>(b.np==null?-1:b.np)-(a.np==null?-1:a.np));
  // 원래 반별 비교
  const groups={};stRows.forEach(r=>r.orig.forEach(o=>(groups[o]=groups[o]||[]).push(r)));
  // 문항별 오답(항목 단위 기록만)
  const qs={};N.filter(x=>x.q!=null).forEach(x=>{const key=x.src+'|'+x.q;const o=(qs[key]=qs[key]||{src:x.src,q:x.q,unit:x.unit,kind:x.kind,ans:x.ans,wrong:0,n:0});o.n++;if(x.c<1)o.wrong++});
  const qList=Object.values(qs).filter(o=>o.wrong>0).sort((a,b)=>(b.wrong/b.n-a.wrong/a.n)||(b.wrong-a.wrong));
  const wrongBy=(key,name)=>qList.filter(o=>(o[key]||(key==='kind'?'(유형 미지정)':'(단원 미지정)'))===name);
  // 단원 x 유형
  const mx={};N.forEach(x=>{const u=x.unit||'(단원 미지정)',k=x.kind||'(유형 미지정)';((mx[u]=mx[u]||{})[k]=(mx[u][k]||{c:0,n:0,q:0}));const t=mx[u][k];t.c+=x.c;t.n+=x.n;t.q++});
  const kinds=Object.keys(nK).sort((a,b)=>pcOf(nK[a])-pcOf(nK[b])),units=Object.keys(nU).sort((a,b)=>pcOf(nU[a])-pcOf(nU[b]));
  const cellList=[];units.forEach(u=>kinds.forEach(k=>{const t=(mx[u]||{})[k];if(t&&t.q>=2)cellList.push({u,k,p:pcOf(t),q:t.q})}));cellList.sort((a,b)=>a.p-b.p);
  // 문제 출제용 요약
  const ex=(pred)=>qList.filter(pred).slice(0,3).map(o=>`${o.src} ${o.q}번${o.ans?'(정답 '+o.ans+')':''}`).join(', ');
  const L=[`■ ${c.name}${cat?' ['+cat+']':''} 약점 요약 (${c.start&&c.end?c.start+'~'+c.end+', ':''}학생 ${sids.length}명, 기록 ${N.length}칸)`,`전체 정답률: 내신 ${pctS(pcOf(nAll))} / 정규(내신 전) ${pctS(pcOf(rAll))}`,'','[자주 틀리는 유형 TOP3]'];
  kinds.filter(k=>nK[k].q>=2&&pcOf(nK[k])<80).slice(0,3).forEach(k=>L.push(`• ${k}: 정답률 ${pctS(pcOf(nK[k]))}${rK[k]?' (정규 '+pctS(pcOf(rK[k]))+')':''} — 오답 문항 예: ${ex(o=>(o.kind||'(유형 미지정)')===k)||'-'}`));
  L.push('','[단원×유형 약점 TOP6]');
  cellList.filter(x=>x.p<80).slice(0,6).forEach(x=>L.push(`• ${x.u} · ${x.k}: ${Math.round(x.p)}% (문항 ${x.q}개) — 오답 문항 예: ${ex(o=>(o.unit||'(단원 미지정)')===x.u&&(o.kind||'(유형 미지정)')===x.k)||'-'}`));

  NBRIEF=L.join('\n');
  const typeRows=(()=>{const T=tally(NA,'type'),src={};NA.forEach(x=>{(src[x.type]=src[x.type]||new Set()).add(x.src)});return Object.keys(T).map(k=>`<tr><td>${esc(k)}</td><td>${src[k].size}회</td><td><b>${pctS(pcOf(T[k]))}</b></td></tr>`).join('')})();
  const exRows=DB.exams.filter(e=>e.classIds.includes(c.id)&&(!cat||e.type===cat)).sort((a,b)=>b.date.localeCompare(a.date)).map(e=>{const scs=examStudents(e,c.id).map(m=>score(e,m.id)).filter(v=>v!=null),mx=totalPt(e);return `<tr><td>${esc(e.date)}</td><td>${esc(e.name)}</td><td><span class="badge">${esc(e.type)}</span></td><td>${scs.length}명</td><td>${scs.length?fmt(avg(scs))+' / '+fmt(mx):'-'}</td><td class="hide-s">${scs.length?fmt(Math.max(...scs))+' ~ '+fmt(Math.min(...scs)):'-'}</td><td style="white-space:nowrap"><a href="#/exam/${e.id}?c=${c.id}&tab=grade">결과표·오답</a> · <a href="#/exam/${e.id}?c=${c.id}&tab=msg">문자</a></td></tr>`}).join('');
  const card=(t,v,sub,col)=>`<div class="card" style="flex:1;min-width:120px;padding:10px 12px"><div class="sub">${t}</div><div class="sc" style="color:${col||'inherit'}">${v}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>`;
  const heat=p=>p==null?'':p>=80?'#16a34a33':p>=60?'#d9770633':'#dc262633';
  const cmpRows=(Tn,Tr,names)=>names.map(n=>{const a=pcOf(Tn[n]),b=pcOf(Tr[n]);return `<tr><td>${esc(n)}</td><td style="min-width:120px"><div class="row" style="gap:6px;flex-wrap:nowrap"><div class="bar ${a!=null&&a<60?'low':''}" style="width:70px;min-width:70px"><i style="width:${Math.round(a||0)}%"></i></div><b>${pctS(a)}</b></div></td><td>${pctS(b)}</td><td>${a!=null&&b!=null?dTxt(a-b):'-'}</td><td class="hide-s">${Tn[n].q}</td></tr>`}).join('');
  app.innerHTML=`<div class="row"><h2 style="margin:0">내신 관리</h2>${list.length>1?`<select onchange="location.hash='#/naesin?c='+this.value">${list.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`:`<b>${esc(c.name)}</b>`}<span class="sub">${c.members.length}명${periodTxt(c)}</span><span class="sp"></span><button class="btn sm" onclick="printNaesin()">인쇄</button></div>
  <div class="row" style="margin:8px 0">${[['lesson','수업 기록'],['att','출결'],['daily','일일테스트'],['exams','시험'],['report','반 리포트'],['roster','명단']].map(([k,t])=>`<button class="btn sm" onclick="location.hash='#/class/${c.id}?tab=${k}'">${t}</button>`).join('')}</div>
  <p class="note">이 반의 기록은 정규 기록과 <b>따로</b> 보관돼요(학생의 정규 성장 리포트에는 섞이지 않아요). 아래 "정규"는 이 반 시작 전의 정규 기록이에요.</p>
  <div class="row" style="margin:8px 0"><span class="sub">시험 종류</span>${[['','전체'],['단원테스트','단원테스트'],['서술테스트','서술테스트'],['기출모의고사','기출모의고사']].map(([k,t])=>`<a class="btn sm ${cat===k?'pri':''}" href="#/naesin?c=${c.id}${k?'&t='+encodeURIComponent(k):''}">${t}</a>`).join('')}</div>
  <div id="nwrap">
  <div class="row" style="margin:10px 0">${card('내신 정답률',pctS(pcOf(nAll)),`기록 ${N.length}칸`,'#b45309')}${card('정규 정답률',pctS(pcOf(rAll)),'이 반 시작 전')}${card('차이',nAll.n&&rAll.n?dTxt(pcOf(nAll)-pcOf(rAll)):'-','내신 − 정규')}${card('시험·TEST 기록',N.length?new Set(N.map(x=>x.src)).size+'회':'0회','')}</div>
  ${N.length?'':'<p class="note">아직 이 반에 시험이나 일일테스트 기록이 없어요. 반의 [시험]·[일일테스트]·[수업] 탭에서 기록하거나, 시험지·점수 이미지를 보내주시면 등록해 드려요.</p>'}

  ${stRows.map(r=>`<tr><td style="white-space:nowrap"><a href="#/student/${r.sid}" style="color:inherit;font-weight:600">${esc(stu(r.sid).name)}</a></td><td class="hide-s sub">${esc(r.orig.join(', '))||'-'}</td><td>${r.nrec}</td><td><b>${pctS(r.np)}</b></td><td>${pctS(r.rp)}</td><td>${dTxt(r.diff)}</td><td>${r.rate==null?'-':r.rate+'%'}</td><td class="weak">${esc(r.wk.join(', '))||'-'}</td><td class="hide-s weak">${esc(r.wu.join(', '))||'-'}</td></tr>`).join('')}</table></div>
  <div class="sub">평균은 시험·일일테스트·수업 TEST를 만점 대비 %로 환산한 값이에요. 약한 유형·단원은 같은 항목을 2번 이상 푼 것 중 정답률 60% 미만이에요.</div>
  ${Object.keys(groups).length?`<h3>원래 반별 비교</h3><table class="t"><tr><th>원래 반</th><th>인원</th><th>정규 평균</th><th>내신 평균</th><th>차이</th></tr>${Object.entries(groups).sort((a,b)=>b[1].length-a[1].length).map(([n,a])=>{const rp=avgP(a.map(x=>x.rp)),np=avgP(a.map(x=>x.np));return `<tr><td>${esc(n)}</td><td>${a.length}</td><td>${pctS(rp)}</td><td><b>${pctS(np)}</b></td><td>${rp!=null&&np!=null?dTxt(np-rp):'-'}</td></tr>`}).join('')}</table>`:''}

function printNaesin(){const w=document.getElementById('nwrap');if(!w)return;const t=document.querySelector('#app h2').nextElementSibling;
  $('#printArea').innerHTML=`<div class="rep" style="padding:16px"><h1>내신 관리 보고서</h1><div>${today()} 발행</div>${w.innerHTML}</div>`;setTimeout(()=>window.print(),50)}
/* 학생 페이지: 내신 기록은 정규 기록과 따로 */
function naesinStudentBlock(sid){
  const has=recsOf(sid,'내신').length||attOfStudent(sid,'내신').length||DB.lessons.some(l=>isNaesinCls(l.cid)&&l.per&&l.per[sid]);
  if(!has)return '';
  const ex=DB.exams.filter(e=>score(e,sid)!=null&&matchTrack(examClass(e,sid),'내신')).sort((a,b)=>b.date.localeCompare(a.date));
  const notes=ex.map(e=>({e,n:noteOf(e,sid)})).filter(x=>x.n);
  return `<div class="card" style="border:2px solid #b45309;margin-top:18px"><h2 style="margin:0 0 6px;color:#b45309">내신 기록 <span class="sub">(정규 기록과 따로 보관)</span></h2>
  ${notes.length?notes.map(({e,n})=>`<div class="card" style="margin-bottom:8px"><div class="sub">${esc(e.date)} · ${esc(e.name)} · ${fmt(score(e,sid))}점${bdTxt(e,sid)}</div><div style="margin-top:6px;white-space:pre-wrap"><b>평가</b> ${esc(n.eval)}</div><div style="margin-top:6px;white-space:pre-wrap"><b>조언</b>\n${esc(n.advice)}</div></div>`).join(''):''}

function weakInExam(e,sid){

  r.m.forEach((v,i)=>{if(v==null)return;const u=((e.items[i]||{}).unit||'').trim();if(!u)return;const t=(U[u]=U[u]||{c:0,n:0});t.n++;t.c+=qv(r,i)});
  return Object.entries(U).filter(([u,t])=>t.c<t.n).sort((a,b)=>a[1].c/a[1].n-b[1].c/b[1].n).slice(0,3).map(([u,t])=>`${u}(${fmt(t.n-t.c)}문항 오답)`);

function scoreMsg(e,c,sid,o){
  const s=stu(sid),sc=score(e,sid),max=totalPt(e)||100;if(sc==null)return null;
  const scs=examStudents(e,c.id).map(m=>score(e,m.id)).filter(v=>v!=null),av=avg(scs),n=scs.length;
  const L=[`[${s.name} 학생] ${mdd(e.date)} ${e.name} 결과`,`• 점수: ${fmt(sc)}점 / ${fmt(max)}점`];
  {const P=scoreParts(e,sid);if(P&&P.part>0)L[1]+=` (부분점수 ${fmt(P.part)}점 포함)`}
  if(o.avg&&n>1)L.push(`• 반 평균: ${fmt(av)}점 (${sc-av>=0?'+':''}${fmt(sc-av)})`);
  if(o.rank&&n>1)L.push(`• 등수: ${1+scs.filter(x=>x>sc).length}등 / ${n}명`);
  const pv=o.prev?prevExamOf(e,sid):null;
  if(pv){const d=sc/max*100-score(pv,sid)/(totalPt(pv)||100)*100;L.push(`• 지난 ${e.type}(${mdd(pv.date)}) 대비: ${d>0.5?'▲ '+fmt(d)+'점 상승':d<-0.5?'▼ '+fmt(-d)+'점 하락':'비슷한 수준'}`)}
  const r=(DB.results[e.id]||{})[sid],hasM=r&&r.m&&r.m.some(v=>v!=null);

  if(o.diff){const dl=diffLine(e,sid,false);if(dl)L.push('• '+dl)}
  if(o.unit){const wk=weakInExam(e,sid);if(wk.length)L.push(`• 보완할 단원: ${wk.join(', ')}`)}

  return L.join('\n');
}

/* ===== 반 성적표: 점수·등수·평균을 누적해서 한눈에 (대시보드) ===== */
let SC_MODE='all',SC_N=0,SC_BASIS='total',SC_STU='',SC_DIST=-1,SC_TSV='';
function setScMode(v){SC_MODE=v;render()}
function setScN(v){SC_N=+v||0;render()}
function setScBasis(v){SC_BASIS=v;render()}
function setScStu(v){SC_STU=v;render()}

function gridSub(e,ms,sid){const sc=score(e,sid);if(sc==null)return '';const all=ms.map(x=>score(e,x.id)).filter(v=>v!=null),av=avg(all);return `${all.length>1?(1+all.filter(v=>v>sc).length)+'등 · ':''}평균${sc-av>=0?'+':''}${fmt(sc-av)}`}
const sdOf=a=>{a=a.filter(v=>v!=null);if(a.length<2)return null;const m=a.reduce((x,y)=>x+y,0)/a.length;return Math.sqrt(a.reduce((x,y)=>x+(y-m)*(y-m),0)/a.length)};
const medOf=a=>{a=a.filter(v=>v!=null).sort((x,y)=>x-y);if(!a.length)return null;const m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2};
function lineChart(series,labels){
  const W=720,H=230,PL=34,PR=14,PT=14,PB=34,n=labels.length;
  if(n<2)return '<div class="sub">시험이 2회 이상 쌓이면 추이 그래프가 나와요.</div>';
  const x=i=>PL+i*(W-PL-PR)/(n-1),y=v=>PT+(1-Math.max(0,Math.min(100,v))/100)*(H-PT-PB);
  const grid=[0,25,50,75,100].map(g=>`<line x1="${PL}" x2="${W-PR}" y1="${y(g)}" y2="${y(g)}" stroke="#8884" stroke-width="1"/><text x="${PL-5}" y="${y(g)+4}" font-size="10" text-anchor="end" fill="#888">${g}</text>`).join('');
  const step=Math.ceil(n/10);
  const xl=labels.map((l,i)=>(i%step===0||i===n-1)?`<text x="${x(i)}" y="${H-12}" font-size="10" text-anchor="middle" fill="#888">${esc(l)}</text>`:'').join('');
  const lines=series.map(se=>{const pts=se.vals.map((v,i)=>v==null?null:[x(i),y(v),v]);const seg=[];let cur=[];pts.forEach(p=>{if(p)cur.push(p);else{if(cur.length)seg.push(cur);cur=[]}});if(cur.length)seg.push(cur);
    return seg.map(s=>`<polyline fill="none" stroke="${se.color}" stroke-width="${se.w||2}" ${se.dash?'stroke-dasharray="5 4"':''} points="${s.map(p=>p[0]+','+p[1]).join(' ')}"/>`).join('')+pts.filter(Boolean).map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="${se.label?4:2.5}" fill="${se.color}"/>${se.label?`<text x="${p[0]}" y="${p[1]-9}" font-size="11" text-anchor="middle" fill="${se.color}">${fmt(p[2])}</text>`:''}`).join('')}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:auto">${grid}${xl}${lines}</svg><div>${series.map(se=>`<span style="color:${se.color};font-size:12px;margin-right:10px">● ${esc(se.name)}</span>`).join('')}</div>`;
}

const dGrp=d=>d<=0?'':d<=2?'하':d===3?'중':'상';
const DCOL={하:'#16a34a',중:'#d97706',상:'#dc2626'};
function dTag(it){const d=+(it&&it.diff)||0;if(!d)return '';const g=dGrp(d);return `<span style="display:inline-block;font-size:11px;line-height:1;padding:3px 7px;border-radius:99px;background:${DCOL[g]};color:#fff;vertical-align:middle" title="난이도 ${D5[d]}">${g}</span>`}
function dLbl(it){const d=+(it&&it.diff)||0;return d?dGrp(d):''}
function wrongDetail(e,sid,html){ // "3번(상), 7번(중·부분)"
  const r=(DB.results[e.id]||{})[sid];if(!r||!r.m)return '';
  return r.m.map((v,i)=>{if(v==null||+v>=1)return null;const it=e.items[i]||{},part=(+v>0)||(+((r.p||{})[i])>0),g=dLbl(it);
    const tag=(g||part)?`(${html&&g?`<b style="color:${DCOL[g]}">${g}</b>`:g}${g&&part?'·':''}${part?'부분':''})`:'';return `${i+1}번${tag}`}).filter(Boolean).join(', ');
}
function diffStat(e,sid){
  const r=(DB.results[e.id]||{})[sid];if(!r||!r.m)return null;
  const G={하:{n:0,ok:0,bad:0},중:{n:0,ok:0,bad:0},상:{n:0,ok:0,bad:0}};let any=false;
  e.items.forEach((it,i)=>{const d=+it.diff||0,v=r.m[i];if(!d||v==null)return;any=true;const g=G[dGrp(d)];g.n++;if(+v>=1)g.ok++;else g.bad++});
  return any?G:null;
}
function diffLine(e,sid,html){
  const G=diffStat(e,sid);if(!G)return '';
  const parts=Object.keys(G).filter(g=>G[g].n).map(g=>`${html?`<b style="color:${DCOL[g]}">${g}</b>`:g} ${G[g].n}문항 중 ${G[g].ok}개 정답${G[g].bad?` · ${G[g].bad}개 틀림`:''}`);
  return parts.length?(html?'<div class="sub" style="margin-top:2px">난이도별 · ':'난이도별 ')+parts.join(html?'　|　':' / ')+(html?'</div>':''):'';
}
function diffStuBlock(sid){
  const T={하:{n:0,ok:0},중:{n:0,ok:0},상:{n:0,ok:0}},rows=[];
  DB.exams.forEach(e=>{const G=diffStat(e,sid);if(!G)return;Object.keys(G).forEach(g=>{T[g].n+=G[g].n;T[g].ok+=G[g].ok});rows.push({e,G})});
  if(!rows.length)return '';
  const rate=g=>T[g].n?T[g].ok/T[g].n:null;
  const cm=[];
  if(T['하'].n>=3&&rate('하')<.85)cm.push('쉬운 문항에서 실수가 있어요. 풀이 검산과 꼼꼼함을 점검해 주세요.');
  if(T['상'].n>=3&&rate('상')<.3)cm.push('상 난이도 문항은 아직 어려워해요. 상위 유형을 단계별로 보강하세요.');
  if(T['상'].n>=3&&rate('상')>=.7)cm.push('상 난이도 문항도 잘 해결해요.');
  if(T['중'].n>=3&&rate('중')<.6)cm.push('중간 난이도(기본 응용) 정답률이 낮아요. 개념 정리부터 확인하세요.');
  rows.sort((a,b)=>b.e.date.localeCompare(a.e.date));
  return `<h3>난이도별 정답·오답 (누적)</h3>
  <table class="t"><tr><th>난이도</th><th>문항</th><th>정답</th><th>틀림</th><th>정답률</th></tr>${['하','중','상'].filter(g=>T[g].n).map(g=>`<tr><td><b style="color:${DCOL[g]}">${g}</b></td><td>${T[g].n}</td><td>${T[g].ok}</td><td>${T[g].n-T[g].ok}</td><td><div class="row" style="gap:6px;flex-wrap:nowrap"><div class="bar ${rate(g)<.5?'low':''}" style="width:80px;min-width:80px"><i style="width:${Math.round(rate(g)*100)}%"></i></div>${Math.round(rate(g)*100)}%</div></td></tr>`).join('')}</table>
  ${cm.length?`<div class="card" style="margin-top:6px">${cm.map(x=>'• '+esc(x)).join('<br>')}</div>`:''}
  <div class="scroll" style="max-height:none"><table class="t" style="margin-top:6px"><tr><th>날짜</th><th>시험</th><th>난이도별 (정답/문항)</th></tr>${rows.slice(0,30).map(({e,G})=>`<tr><td>${esc(e.date.slice(5))}</td><td>${esc(e.name.slice(0,22))}</td><td style="white-space:nowrap">${['하','중','상'].filter(g=>G[g].n).map(g=>`<b style="color:${DCOL[g]}">${g}</b> ${G[g].ok}/${G[g].n}`).join('　')}</td></tr>`).join('')}</table></div>`;
}
/* ===== 명단 편집 도우미 (반·학생은 언제든 바뀔 수 있어요) ===== */
const ko=(a,b)=>a.name.localeCompare(b.name,'ko');
const sortMembers=c=>c.members.sort((a,b)=>stu(a.id).name.localeCompare(stu(b.id).name,'ko'));
function addStudent(o){const id=o.eid&&!DB.roster.students[o.eid]?o.eid:'s'+uid().slice(1);DB.roster.students[id]={id,eid:o.eid||'',name:(o.name||'').trim(),grade:(o.grade||'').trim(),school:(o.school||'').trim()};return id}
function addToClass(cid,sid,hold){const c=cls(cid);if(!c.members.some(m=>m.id===sid))c.members.push({id:sid,hold:!!hold});sortMembers(c)}
function removeFromClass(cid,sid){const c=cls(cid);c.members=c.members.filter(m=>m.id!==sid)}
const classesOf=sid=>DB.roster.classes.filter(c=>c.members.some(m=>m.id===sid));
const hasResults=sid=>DB.exams.some(e=>(DB.results[e.id]||{})[sid]);
const activeClasses=()=>DB.roster.classes.filter(c=>!c.archived);
function examStudents(e,cid){ // 이 시험을 본 학생(반을 옮겨도 기록이 남게, 시험에 저장된 명단을 우선)
  const c=cls(cid),cur=new Map((c?c.members:[]).map(m=>[m.id,m]));
  const ids=e.roster&&Object.keys(e.roster).length?Object.keys(e.roster).filter(s=>e.roster[s]===cid):[...cur.keys()];
  return ids.filter(s=>stu(s)).map(s=>({id:s,hold:!!(cur.get(s)||{}).hold})).sort((a,b)=>stu(a.id).name.localeCompare(stu(b.id).name,'ko'));
}

function releaseAll(){const n=DB.roster.classes.reduce((a,c)=>a+c.members.filter(m=>m.hold).length,0);if(!confirm(`휴원으로 표시된 ${n}건(반별 기준)을 모두 등원(복귀) 처리할까요?`))return;DB.roster.classes.forEach(c=>c.members.forEach(m=>{m.hold=false}));save();render()}
function home(app){

      <div class="sub">${c.days?esc(c.days)+' · ':''}${c.members.length}명${periodTxt(c)}${c.members.some(m=>m.hold)?' (휴원 포함)':''}</div>
      <div class="sub" style="margin-top:6px">${ex?`최근: ${esc(ex.name)} · 평균 ${fmt(examAvg(ex))}점`:'등록된 시험 없음'}</div></div>`};
  app.innerHTML=`<div class="row"><h2 style="margin:0">내 반</h2><span class="sp"></span>${DB.roster.classes.some(c=>c.members.some(m=>m.hold))?`<button class="btn sm" onclick="releaseAll()">휴원 전원 복귀</button>`:''}<button class="btn sm" onclick="location.hash='#/students'">학생 전체</button><button class="btn sm pri" onclick="location.hash='#/classedit/new'">+ 반 추가</button></div>
    ${todayBlock()}<div class="grid" style="margin-top:10px">${act.map(card).join('')}</div>
    ${arc.length?`<h3>보관된 반</h3><div class="grid">${arc.map(card).join('')}</div>`:''}
    <p class="note" style="margin-top:16px">반·학생은 언제든 추가·이동·휴원·퇴원할 수 있어요(반 안의 [명단] 탭, [학생 전체]). 지난 시험 기록은 학생에게 그대로 남아요. 데이터는 이 기기에 저장되니 [백업]에서 파일로 받아두세요. '외부 학생' 반은 수업 외 학생의 시험지 체크·조언용이에요.</p>`;
}

      <details style="margin-top:8px"><summary class="sub">여러 명 한꺼번에 (한 줄에 [ID,] 이름, 학년, 학교)</summary><textarea id="ns-b" rows="4" placeholder="2169926, 김철수, 중2, 서일중   (ID는 생략 가능)"></textarea><button class="btn sm" onclick="bulkStu('${cid}')">추가</button></details></div>

      return `<tr class="${m.hold?'hold':''}"><td><a href="#/student/${m.id}" style="color:inherit">${esc(s.name)}</a>${m.hold?' <span class="badge">휴원</span>':''}</td><td>${esc(s.grade)}</td><td class="hide-s">${esc(s.school)}</td><td>${fmt(last)}</td>
      <td style="text-align:right;white-space:nowrap"><button class="btn sm" onclick="toggleHold('${cid}','${m.id}')">${m.hold?'복귀':'휴원'}</button> <select class="btn sm" onchange="moveStu('${cid}','${m.id}',this.value)"><option value="">이동…</option>${targets.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select> <button class="btn sm danger" onclick="outStu('${cid}','${m.id}')">빼기</button></td></tr>`}).join('')+`</table>

  }else{
    const ex=examsOf(cid);
    body=`<div class="row" style="margin-bottom:10px"><button class="btn pri" onclick="location.hash='#/exam/new/${cid}'">+ 시험 직접 등록</button><span class="sub">보통은 시험지·채점 이미지를 Claude에게 주면 등록돼요.</span></div>`+
    (ex.length?`<table class="t"><tr><th>시험</th><th class="hide-s">날짜</th><th>평균</th><th class="hide-s">난이도</th><th>응시/총원</th><th></th></tr>`+ex.map(e=>{
      const ids=examStudents(e,cid).map(m=>m.id);const done=ids.filter(s=>score(e,s)!=null).length;

}
function delExam(id){const e=DB.exams.find(x=>x.id===id);if(!confirm(`'${e.name}' 시험과 등록된 결과·평가를 모두 삭제할까요? 되돌릴 수 없어요.`))return;
  DB.exams=DB.exams.filter(x=>x.id!==id);delete DB.results[id];delete DB.notes[id];save();render()}
function newStu(cid){const n=$('#ns-n').value.trim();if(!n)return alert('이름을 입력해 주세요.');
  const eid=$('#ns-i').value.trim(),ex=eid&&findByEid(eid);addToClass(cid,ex?ex.id:addStudent({name:n,grade:$('#ns-g').value,school:$('#ns-s').value,eid}));save();render()}
function existStu(cid){const sid=$('#ns-e').value;if(!sid)return;addToClass(cid,sid);save();render()}
function bulkStu(cid){const lines=$('#ns-b').value.split('\n').map(l=>l.trim()).filter(Boolean);
  lines.forEach(l=>{const p=l.split(/[,\t]/).map(x=>x.trim());let eid='';if(/^\d{4,}$/.test(p[0]))eid=p.shift();const [n,g,sc]=p,ex=eid&&findByEid(eid);if(ex)addToClass(cid,ex.id);else if(n)addToClass(cid,addStudent({name:n,grade:g,school:sc,eid}))});save();render()}
function toggleHold(cid,sid){const m=cls(cid).members.find(x=>x.id===sid);m.hold=!m.hold;save();render()}
function moveStu(cid,sid,to){if(!to)return;const was=cls(cid).members.find(x=>x.id===sid);removeFromClass(cid,sid);addToClass(to,sid,was&&was.hold);save();render()}
function outStu(cid,sid){if(!confirm(`${stu(sid).name} 학생을 이 반에서 뺄까요? 지난 시험 기록은 남아요.`))return;removeFromClass(cid,sid);save();render()}

function saveExam(){syncMeta();const e=DRAFT;
  if(!e.name.trim()) return alert('시험 이름을 입력해 주세요.');

  const out={id:e._existing||uid(),name:e.name.trim(),type:e.type,date:e.date,classIds:e.classIds,items:e.items.map(i=>({ans:i.ans,unit:i.unit,kind:i.kind||'',pt:+i.pt||0,diff:+i.diff||0}))};
  const prev=DB.exams.find(x=>x.id===out.id);if(prev&&prev.roster)out.roster=prev.roster;if(prev&&prev.base)out.base=prev.base;if(prev&&prev.dnote)out.dnote=prev.dnote;
  const tot=totalPt(out);if(Math.abs(tot-100)>0.01&&!confirm(`배점 합계가 ${fmt(tot)}점이에요. 테스트는 100점 만점이 기본이에요.\n그래도 이대로 저장할까요?`))return;
  const k=DB.exams.findIndex(x=>x.id===out.id);if(k>=0)DB.exams[k]=out;else DB.exams.push(out);

function statRows(U){
  return Object.entries(U).sort((a,b)=>a[1].c/a[1].n-b[1].c/b[1].n).map(([u,s])=>{const p=Math.round(s.c/s.n*100);
    return `<tr><td>${esc(u)}</td><td style="width:50%"><div class="bar ${p<60?'low':''}"><i style="width:${p}%"></i></div></td><td>${p}% <span class="sub">(${fmt(s.c)}/${s.n})</span></td></tr>`}).join('')||'<tr><td class="sub">결과가 등록되면 표시돼요</td></tr>';
}
function analysis(pane,e,c){
  const ids=examStudents(e,c.id).map(m=>m.id);
  const rows=ids.map(s=>({s,sc:score(e,s)})).sort((a,b)=>(b.sc??-1)-(a.sc??-1));

    <div class="sub">오답 문항: ${w.length?wrongDetail(e,r.s,true):'없음'}</div>${diffLine(e,r.s,true)}${whyList(e,r.s)}
    ${n?`<div style="margin-top:6px;white-space:pre-wrap"><b>평가</b> ${esc(n.eval)}</div><div style="margin-top:6px;white-space:pre-wrap"><b>조언</b>
${esc(n.advice)}</div>`:'<div class="sub" style="margin-top:6px">아직 평가가 없어요. Claude에게 분석을 요청해 주세요.</div>'}</div>`}).join('')}

  <h3>유형별 정답률</h3><table class="t"><tr><th>유형</th><th>정답률</th><th></th></tr>${statRows(unitStats(withM,[e],'kind'))}</table>
  <h3>문항별 정답률</h3><table class="t"><tr><th>#</th><th>정답</th><th>단원 · 유형</th><th>정답률</th></tr>${e.items.map((it,i)=>{const q=qrate[i],p=q.r==null?null:Math.round(q.r*100);return `<tr><td style="white-space:nowrap">${i+1} ${dTag(it)}</td><td>${esc(it.ans)}</td><td>${esc(it.unit)}${it.kind?' · '+esc(it.kind):''}</td><td>${p==null?'-':`<div class="row"><div class="bar ${p<50?'low':''}" style="width:90px"><i style="width:${p}%"></i></div>${p}% <span class="sub">(${fmt(q.k)}/${q.n})</span></div>`}</td></tr>`}).join('')}</table>`;

    <select onchange="inClass('${sid}',this.value)"><option value="">+ 반에 넣기…</option>${rest.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>
  <details><summary class="sub">학생 정보 수정 · 퇴원 처리</summary><div class="card" style="margin-top:8px"><div class="row"><input id="sn" value="${esc(s.name)}" style="width:100px"><input id="sg" value="${esc(s.grade)}" placeholder="학년" style="width:90px"><input id="ss" value="${esc(s.school)}" placeholder="학교" style="width:150px"><input id="se" value="${esc(eidOf(s))}" placeholder="학원 ID" style="width:110px"><button class="btn pri" onclick="saveStu('${sid}')">저장</button></div>
   <div class="row" style="margin-top:8px">${s.archived?`<button class="btn" onclick="archiveStu('${sid}')">퇴원 취소(복원)</button>`:`<button class="btn" onclick="archiveStu('${sid}')">퇴원 처리 (모든 반에서 빼고 보관)</button>`}${hasResults(sid)?'':`<button class="btn danger" onclick="delStu('${sid}')">삭제</button>`}</div></div></details>
  <h3>평가·조언 (상담 참고)</h3>${notes.length?notes.map(({e,n})=>`<div class="card" style="margin-bottom:8px"><div class="sub">${esc(e.date)} · ${esc(e.name)} · ${fmt(score(e,sid))}점${bdTxt(e,sid)} · 오답 ${wrongDetail(e,sid,true)||'없음'}</div>${diffLine(e,sid,true)}<div style="margin-top:6px;white-space:pre-wrap"><b>평가</b> ${esc(n.eval)}</div><div style="margin-top:6px;white-space:pre-wrap"><b>조언</b>
${esc(n.advice)}</div></div>`).join(''):'<p class="note">아직 평가가 없어요. 시험지와 채점 이미지를 Claude에게 주면 만들어 드려요.</p>'}
  ${diffStuBlock(sid)}
  ${causeBlock(sid)}
  <h3>수업 기록</h3>${lessonBlock(sid)}
  <h3>출결</h3>${attCalendar(sid)}${attBlock(sid)}
  <h3>성장 리포트</h3>${growthBlock(sid)}
${naesinStudentBlock(sid)}
  <h3>상담 메모 (선생님용)</h3><textarea id="memo" rows="3" placeholder="상담·관찰 메모">${esc(DB.memos[sid]||'')}</textarea>
  <h3>성적표 코멘트 (성적표에 인쇄됨)</h3><textarea id="cmt" rows="3" placeholder="학부모께 전할 한마디">${esc(DB.comments[sid]||'')}</textarea>`;
  $('#memo').onchange=ev=>{DB.memos[sid]=ev.target.value;save()};
  $('#cmt').onchange=ev=>{DB.comments[sid]=ev.target.value;save()};
}
function outStu2(cid,sid){outStu(cid,sid)}
function inClass(sid,cid){if(!cid)return;addToClass(cid,sid);save();render()}
function saveStu(sid){const n=$('#sn').value.trim();if(!n)return alert('이름을 입력해 주세요.');const s=stu(sid);s.name=n;s.grade=$('#sg').value.trim();s.school=$('#ss').value.trim();s.eid=$('#se').value.trim();DB.roster.classes.forEach(sortMembers);save();render()}
function archiveStu(sid){const s=stu(sid);if(!s.archived){if(!confirm(`${s.name} 학생을 퇴원 처리할까요? 모든 반에서 빠지고, 기록은 보관돼요.`))return;DB.roster.classes.forEach(c=>{c.members=c.members.filter(m=>m.id!==sid)});s.archived=true}else s.archived=false;save();render()}
function delStu(sid){if(!confirm('이 학생 정보를 완전히 삭제할까요?'))return;DB.roster.classes.forEach(c=>{c.members=c.members.filter(m=>m.id!==sid)});delete DB.roster.students[sid];save();location.hash='#/students'}
function chart(sid,exams){
  if(!exams.length) return '<span class="sub">데이터 없음</span>';
  const W=600,H=190,P=30,n=exams.length,x=i=>n===1?W/2:P+i*(W-2*P)/(n-1),y=v=>H-P-(v/100)*(H-2*P);
  const pts=exams.map((e,i)=>[x(i),y(score(e,sid))]), av=exams.map((e,i)=>[x(i),y(examAvg(e)??0)]);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:640px">${[0,50,100].map(v=>`<line x1="${P}" x2="${W-P}" y1="${y(v)}" y2="${y(v)}" stroke="#8884" /><text x="4" y="${y(v)+4}" font-size="11" fill="#888">${v}</text>`).join('')}
  <polyline fill="none" stroke="#888" stroke-dasharray="4 4" points="${av.map(p=>p.join(',')).join(' ')}"/>
  <polyline fill="none" stroke="#1968b3" stroke-width="2.5" points="${pts.map(p=>p.join(',')).join(' ')}"/>
  ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#1968b3"/><text x="${p[0]}" y="${p[1]-9}" font-size="11" text-anchor="middle" fill="#1968b3">${fmt(score(exams[i],sid))}</text><text x="${p[0]}" y="${H-8}" font-size="10" text-anchor="middle" fill="#888">${esc(exams[i].date.slice(5))}</text>`).join('')}</svg><div class="sub">파랑: 본인 · 점선: 시험 평균</div>`;
}
function printReport(sid){
  const s=stu(sid),last=DB.exams.filter(e=>noteOf(e,sid)).sort((a,b)=>b.date.localeCompare(a.date))[0];
  $('#printArea').innerHTML=`<div class="rep" style="padding:20px"><h1>학습 성장 리포트</h1><div>${esc(s.name)} · ${esc(s.grade)} · ${esc(s.school)}${eidOf(s)?' · ID '+esc(eidOf(s)):''} &nbsp;|&nbsp; 발행일 ${today()}</div>${growthBlock(sid)}
  ${last?`<h3>평가 (${esc(last.name)})</h3><div style="border:1px solid #bbb;padding:10px;white-space:pre-wrap">${esc(noteOf(last,sid).eval)}\n\n학습 조언:\n${esc(noteOf(last,sid).advice)}</div>`:''}
  <h3>선생님 코멘트</h3><div style="border:1px solid #bbb;padding:10px;min-height:60px;white-space:pre-wrap">${esc(DB.comments[sid]||'')}</div></div>`;
  setTimeout(()=>window.print(),50);
}

/* ===== 백업·시험 파일 ===== */
function backupPage(app){
  app.innerHTML=`<h2>시험 파일 등록 · 백업</h2>
  <div class="card"><b>시험·일일테스트·수업 기록·출결 파일(JSON) 등록</b><p class="sub">Claude가 시험지와 채점 이미지를 분석해서 만든 파일이에요. 같은 이름·날짜의 시험이 있으면 새 내용으로 바뀝니다.</p>
  <div class="row"><label class="btn pri">파일 선택<input type="file" accept=".json" hidden onchange="importExamFile(this.files[0])"></label><span class="sub">또는 아래에 붙여넣기</span></div>
  <textarea id="ij" rows="4" style="margin-top:8px"></textarea><div class="row" style="margin-top:6px"><button class="btn" onclick="importExam($('#ij').value)">붙여넣은 내용 등록</button></div></div>
  ${SYNC.mode==='cloud'?`<div class="card"><b>클라우드 동기화</b> <span class="sub">${esc(SYNC.user)}</span><div class="row" style="margin-top:8px"><button class="btn" onclick="cloudLogout()">로그아웃</button></div></div>`:''}<h3>백업</h3><div class="card"><p>시험 ${DB.exams.length}개 · 결과가 이 기기에 저장되어 있어요. 기기를 바꾸거나 브라우저 데이터를 지우기 전에 파일로 받아두세요.</p>
  <div class="row"><button class="btn pri" onclick="exportDB()">백업 파일 받기</button><label class="btn">백업 파일 불러오기<input type="file" accept=".json" hidden onchange="importDB(this.files[0])"></label></div></div>`;
}
function exportDB(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB)],{type:'application/json'}));a.download=`반관리_백업_${today()}.json`;a.click()}
function importDB(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.exams)throw 0;if(!confirm('현재 데이터를 이 파일 내용으로 덮어쓸까요?'))return;DB=Object.assign(EMPTY(),d);ensureRoster();save();alert('불러왔어요.');location.hash='#/'}catch(e){alert('올바른 백업 파일이 아니에요.')}};r.readAsText(f)}
function importExamFile(f){if(!f)return;const r=new FileReader();r.onload=()=>importExam(r.result);r.readAsText(f)}
function parseMarks(v,n){
  if(v&&!Array.isArray(v)&&typeof v==='object') v=v.m;
  let a;
  if(typeof v==='string') a=[...v.replace(/[\s,]/g,'')];
  else if(Array.isArray(v)) a=v; else a=[];
  a=a.map(x=>(x===''||x==null)?null:(typeof x==='number'&&x>0&&x<1)?x:(x===0.5||(typeof x==='string'&&x!==''&&'H△½'.includes(x)))?0.5:('O○o1'.includes(String(x))||x===1)?1:(('X✕x×0'.includes(String(x)))||x===0)?0:null);
  while(a.length<n)a.push(null); return a.slice(0,n);
}
function importExam(text){
  try{
    const d=JSON.parse(text); if(!d.items&&(d.daily||d.lessons||d.att)) return importBundle(d);
    if(!d.name||!Array.isArray(d.items)) throw new Error('name, items 가 필요해요.');
    const classIds=[...new Set((d.classIds||d.classes||[d.class]).filter(Boolean).map(resolveClass).filter(Boolean).map(c=>c.id))]; if(!classIds.length) throw new Error('파일 안의 반 이름(class 또는 classIds)을 명단에서 찾지 못했어요. 반 이름이나 별칭을 확인해 주세요.');
    const n=d.items.length, def=Math.round((100-(+d.base||0))/n*100)/100, date=d.date||today();
    const old=DB.exams.find(x=>x.name===d.name&&x.date===date);
    const e={id:old?old.id:uid(),name:d.name,type:d.type||'학력평가',date,classIds,roster:{},base:+d.base||0,items:d.items.map(i=>({ans:i.ans==null?'':String(i.ans),unit:i.unit||'',kind:i.kind||'',pt:i.pt==null?def:+i.pt,diff:+i.diff||0})),dnote:d.dnote||(old&&old.dnote)||''};
    const ext=classIds.find(c=>cls(c).role==='외부'),made=[],miss=[];
    const find=nm=>{
      for(const cid of classIds){const ms=cls(cid).members;const m=ms.find(m=>m.id===nm||stu(m.id).eid===nm)||ms.find(m=>stu(m.id).name===nm);if(m)return {sid:m.id,cid}}
      if(ext){const g=(d.guests||{})[nm]||{};const sid=addStudent({name:nm,grade:g.grade,school:g.school});addToClass(ext,sid);made.push(nm);return {sid,cid:ext}}
      return null};
    const R=old?Object.assign({},DB.results[old.id]):{},N=old?Object.assign({},DB.notes[old.id]):{};
    Object.entries(d.results||{}).forEach(([nm,v])=>{const f=find(nm);if(!f){miss.push(nm);return}const rec={m:parseMarks(v,n),total:(v&&v.total!=null)?+v.total:null};
      if(v&&v.pp)Object.entries(v.pp).forEach(([q,pts])=>{const i=+q-1;if(i>=0&&i<n&&+pts>0){(rec.p=rec.p||{})[i]=Math.min(1,+pts/((+e.items[i].pt)||1))}});
      if(v&&v.w)Object.entries(v.w).forEach(([q,o])=>{const i=+q-1;if(i>=0&&i<n)(rec.w=rec.w||{})[i]=(typeof o==='string')?{c:'',t:o}:{c:o.c||'',t:o.t||''}});
      R[f.sid]=rec;e.roster[f.sid]=f.cid});
    Object.entries(d.notes||{}).forEach(([nm,v])=>{const f=find(nm);if(!f){if(!miss.includes(nm))miss.push(nm);return}N[f.sid]=Object.assign({},N[f.sid],{eval:v.eval||'',advice:v.advice||''});e.roster[f.sid]=e.roster[f.sid]||f.cid});
    if(old){DB.exams[DB.exams.indexOf(old)]=e}else DB.exams.push(e);
    DB.results[e.id]=R;DB.notes[e.id]=N;save();
    alert(`등록했어요. 학생 ${Object.keys(R).length}명 결과, ${Object.keys(N).length}명 평가`+(Math.abs(totalPt(e)-100)>0.01?`\n⚠ 배점 합계가 ${fmt(totalPt(e))}점이에요(100점이 아니에요).`:'')+(made.length?`\n새로 추가된 학생: ${made.join(', ')}`:'')+(miss.length?`\n명단에 없는 이름(건너뜀): ${miss.join(', ')}\n→ 해당 반에 학생을 먼저 추가한 뒤 같은 파일을 다시 등록하세요.`:''));
    location.hash='#/exam/'+e.id+'?c='+classIds[0]+'&tab=analysis';
  }catch(x){alert('등록 실패: '+x.message)}
}
render();
syncInit();
</script>
